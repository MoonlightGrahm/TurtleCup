let nextPlayerNum = 1;
let nextPairNum = 1;
let nextCourseNum = 1;

// wagerBalance is a running NET of settled wagers only (starts at $0 — it is not a prepaid

// Captains set independent pairings per match — default mock data shows different combos each round

function emptyHoles(matchId){
  const count = matchId==='m3' ? 9 : 18;
  if(matchId==='m1' || matchId==='m2'){
    return Array.from({length:count}, () => ({ a1:'', a2:'', b1:'', b2:'' }));
  }
  return Array.from({length:count}, () => ({ a:'', b:'' }));
}

function buildScoresForLineups(lineups){
  const scores = {};
  Object.keys(MATCH_META).forEach(mid => {
    scores[mid] = {};
    (lineups[mid] || []).forEach(pair => {
      scores[mid][pair.id] = { holes: emptyHoles(mid), finalized: false };
    });
  });
  return scores;
}

// Back-fills the `finalized` flag for scorecards saved before explicit finalization existed.
function ensureScoreEntryFields(scores){
  Object.keys(scores||{}).forEach(mid => {
    Object.values(scores[mid]||{}).forEach(entry => {
      if(typeof entry.finalized !== 'boolean') entry.finalized = false;
    });
  });
  return scores;
}

function defaultPurseConfig(){

function defaultState(){

      wagerDraft: { kind:'match', matchId:'', pairingId:'', segment:'', proposerId:'', opponentId:'', side:'red', propKind:'medalist', proposerPick:'', opponentPick:'' } },
    admin: { passcode: DEFAULT_ADMIN_PASSCODE },

    courses: baselineCourses(),
    matchCourse: baselineMatchCourse(),
    lineups,
    scores: buildScoresForLineups(lineups),
    purseConfig: defaultPurseConfig(),
    wagers: [],
    transactionLedger: [],
  };
}

let STATE = defaultState();

/* =========================================================
   PERSISTENCE (offline cache / localStorage sync)
   ========================================================= */
let nextWagerNum = 1;
let nextTxNum = 1;

function recalcCounters(){
  let maxP=0, maxPair=0, maxCourse=0, maxWager=0, maxTx=0;
  [...STATE.roster.red, ...STATE.roster.blue].forEach(p=>{
    const n = parseInt(String(p.id).replace(/[^0-9]/g,''),10);
    if(!isNaN(n)) maxP = Math.max(maxP, n);
  });
  Object.values(STATE.lineups).forEach(list => list.forEach(pair => {
    const n = parseInt(String(pair.id).replace(/[^0-9]/g,''),10);
    if(!isNaN(n)) maxPair = Math.max(maxPair, n);
  }));
  STATE.courses.forEach(c=>{
    const n = parseInt(String(c.id).replace(/[^0-9]/g,''),10);
    if(!isNaN(n)) maxCourse = Math.max(maxCourse, n);
  });
  (STATE.wagers||[]).forEach(w=>{
    const n = parseInt(String(w.wagerId).replace(/[^0-9]/g,''),10);
    if(!isNaN(n)) maxWager = Math.max(maxWager, n);
  });
  (STATE.transactionLedger||[]).forEach(t=>{
    const n = parseInt(String(t.transactionId).replace(/[^0-9]/g,''),10);
    if(!isNaN(n)) maxTx = Math.max(maxTx, n);
  });
  nextPlayerNum = maxP+1;
  nextPairNum = maxPair+1;
  nextCourseNum = maxCourse+1;
  nextWagerNum = maxWager+1;
  nextTxNum = maxTx+1;
}

// Back-fills money fields for rosters saved/imported from before this feature existed.
function ensurePlayerMoneyFields(roster){
  ['red','blue'].forEach(side=>{
    (roster[side]||[]).forEach(p=>{
      if(typeof p.wagerBalance !== 'number') p.wagerBalance = 0;
      if(typeof p.venmo !== 'string') p.venmo = '';
      if(typeof p.zelle !== 'string') p.zelle = '';
      if(!p.stats || typeof p.stats !== 'object') p.stats = baselinePlayerStats();
      if(typeof p.stats.wagersWon !== 'number') p.stats.wagersWon = 0;
      if(typeof p.stats.wagersLost !== 'number') p.stats.wagersLost = 0;
    });
  });
  return roster;
}

function saveState(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      teamNames: STATE.teamNames, roster: STATE.roster, courses: STATE.courses, matchCourse: STATE.matchCourse,
      lineups: STATE.lineups, scores: STATE.scores, admin: { passcode: STATE.admin.passcode },
      purseConfig: STATE.purseConfig, wagers: STATE.wagers, transactionLedger: STATE.transactionLedger,
      ui: { tab: STATE.ui.tab, pairing: STATE.ui.pairing, hole: STATE.ui.hole }, savedAt: Date.now(),
    }));
    lastSavedAt = Date.now();
  } catch(e){ /* storage unavailable — app still works in-memory */ }
  pushCloudState(false);
}

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.roster || !parsed.lineups || !parsed.scores || !parsed.courses) return false;
    STATE.teamNames = parsed.teamNames || STATE.teamNames;
    STATE.roster = ensurePlayerMoneyFields(parsed.roster);
    STATE.courses = parsed.courses;
    STATE.matchCourse = parsed.matchCourse || baselineMatchCourse();
    STATE.lineups = parsed.lineups;
    STATE.scores = ensureScoreEntryFields(parsed.scores);
    STATE.admin = { passcode: (parsed.admin && parsed.admin.passcode) || DEFAULT_ADMIN_PASSCODE };
    STATE.purseConfig = { ...defaultPurseConfig(), ...(parsed.purseConfig||{}) };
    STATE.wagers = parsed.wagers || [];
    STATE.transactionLedger = parsed.transactionLedger || [];
    if(parsed.ui){ STATE.ui.tab = parsed.ui.tab || 'm1'; STATE.ui.pairing = parsed.ui.pairing || STATE.ui.pairing; STATE.ui.hole = parsed.ui.hole || STATE.ui.hole; }
    lastSavedAt = parsed.savedAt || Date.now();
    return true;
  } catch(e){ return false; }
}

function formatClock(ts){

}

/* =========================================================
   CLOUD SYNC (Supabase — optional, falls back to localStorage)
   ========================================================= */

const DEFAULT_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqeGFicGFtbXBwZHFveXpueGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NTY4OTYsImV4cCI6MjEwMzIzMjg5Nn0.vaDc-FkBn22aul1oOghw0ab-c2LyguShML0qK3sNi1Q';

const SUPA_CONFIG_KEY = 'turtleCupSupabaseConfig_v1';
const SUPA_OPTOUT_KEY = 'turtleCupCloudOptOut_v1';
const CLOUD_TABLE = 'turtle_cup_state';
const CLOUD_ROW_ID = 1;

let supabaseClient = null;
let supabaseChannel = null;
let cloudStatus = 'idle'; // 'idle' | 'connecting' | 'connected' | 'error'
let cloudError = '';
let applyingRemoteUpdate = false;
let cloudSyncTimer = null;
let lastCloudPushAt = null;

function loadSupabaseConfig(){
  try{
    const raw = localStorage.getItem(SUPA_CONFIG_KEY);
    if(raw) return JSON.parse(raw);

// Pulls the fields that make up "tournament data" — same shape used for localStorage/export/import.
function cloudPayloadFromState(){
  return {
    teamNames: STATE.teamNames, roster: STATE.roster, courses: STATE.courses,
    matchCourse: STATE.matchCourse, lineups: STATE.lineups, scores: STATE.scores,
    admin: { passcode: STATE.admin.passcode },
    purseConfig: STATE.purseConfig, wagers: STATE.wagers, transactionLedger: STATE.transactionLedger,
  };
}

// Some preview/sandbox iframes (and a few browser extensions) wrap fetch and try to relay the raw
// Response — including its non-cloneable Headers object — to a parent frame via postMessage for
// logging. That relay throws a DataCloneError that has nothing to do with whether the actual
// Supabase request succeeded, so we detect and ignore it rather than surfacing a false failure.
function isSpuriousCloneError(e){
  if(!e) return false;
  const msg = e.message || String(e);
  return e.name==='DataCloneError' || /could not be cloned/i.test(msg) || (/postMessage/i.test(msg) && /Headers/i.test(msg));
}

// True from the moment a local mutation is made until our own push of it has been confirmed
// by Supabase. While true, incoming realtime payloads are NOT applied — our own in-flight write
// represents the true latest state and will supersede whatever's still live in the row. This is
// what stops "I tapped +1 and it flickered back" — without it, a remote snapshot captured before
// our tap can land mid-flight and visibly revert the button the user just pressed.
let pendingLocalChange = false;
// Set when a push fails for a real reason (offline/low-signal) rather than success — the *state
// itself* is the outbox here (we always push the latest full snapshot), so "queueing" just means
// "keep retrying until it lands" rather than buffering individual deltas.
let outboxPending = false;
let retryTimer = null;

// Any realtime payload that arrives while the user has an <input>/<textarea>/<select> focused is
// held here instead of applied immediately, so a remote update can never yank a field out from
// under someone mid-keystroke (Supabase URL/key, wager amount, roster name, custom prop label…).
let queuedRemoteState = null;

function isUserTypingInField(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  return tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT';
}

// Flush any remote update that arrived while a field had focus, the moment focus leaves it.
document.addEventListener('focusout', () => {
  setTimeout(() => {
    if(queuedRemoteState && !isUserTypingInField()){
      const data = queuedRemoteState;
      queuedRemoteState = null;
      applyRemoteState(data);
    }
  }, 50); // let focus land on whatever's next (e.g. tabbing between fields) before deciding
}, true); // focusout only bubbles with a capturing listener

function applyRemoteState(data){
  if(!data) return;
  if(isUserTypingInField()){
    queuedRemoteState = data; // don't rip a field out from under an active edit — apply on blur
    return;
  }
  applyingRemoteUpdate = true;
  try{
    STATE.teamNames = data.teamNames || STATE.teamNames;
    STATE.roster = ensurePlayerMoneyFields(data.roster || STATE.roster);
    STATE.courses = data.courses || STATE.courses;
    STATE.matchCourse = data.matchCourse || STATE.matchCourse;
    STATE.lineups = data.lineups || STATE.lineups;
    STATE.scores = ensureScoreEntryFields(data.scores || STATE.scores);
    STATE.admin = { passcode: (data.admin && data.admin.passcode) || STATE.admin.passcode || DEFAULT_ADMIN_PASSCODE };
    STATE.purseConfig = { ...defaultPurseConfig(), ...(data.purseConfig||{}) };
    STATE.wagers = data.wagers || [];
    STATE.transactionLedger = data.transactionLedger || [];
    recalcCounters();
    renderApp();
  } finally {
    applyingRemoteUpdate = false;
  }
}

async function pushCloudState(immediate){
  if(!supabaseClient || applyingRemoteUpdate) return;
  pendingLocalChange = true;
  const row = { id: CLOUD_ROW_ID, data: cloudPayloadFromState(), updated_at: new Date().toISOString() };
  const doPush = async () => {
    try{
      const { error } = await supabaseClient.from(CLOUD_TABLE).upsert(row);
      if(error) throw error;
      lastCloudPushAt = Date.now();
      outboxPending = false;
      pendingLocalChange = false;
      clearTimeout(retryTimer);
      if(cloudStatus!=='connected'){ cloudStatus='connected'; cloudError=''; renderApp(); }
    } catch(e){
      if(isSpuriousCloneError(e)){
        // The write almost certainly went through — only the browser's postMessage relay choked.
        // Don't scare the user with a red error banner for something that isn't a sync problem.
        console.warn('Turtle Cup: ignored a spurious DataCloneError while pushing to Supabase (likely a preview-sandbox postMessage relay, not a real failure).', e);
        lastCloudPushAt = Date.now();
        outboxPending = false;
        pendingLocalChange = false;
        if(cloudStatus!=='connected'){ cloudStatus='connected'; cloudError=''; renderApp(); }
        return;
      }
      // Real failure — most likely offline or low signal. Keep the local edit exactly as the
      // user left it (STATE already has it) and retry in the background rather than showing a
      // scary error for a dropped bar of signal on the back nine.
      outboxPending = true;
      cloudStatus = navigator.onLine ? 'error' : 'offline-queued';
      cloudError = e.message || 'Push failed — will retry automatically';
      scheduleRetry();
      renderApp();
    }
  };
  if(immediate){ await doPush(); }
  else {
    clearTimeout(cloudSyncTimer);
    cloudSyncTimer = setTimeout(doPush, 500); // debounce rapid taps (score +/-, etc.)
  }
}

function scheduleRetry(){
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => {
    if(outboxPending && supabaseClient) pushCloudState(true);
  }, 4000);
}

function subscribeRealtime(){
  if(!supabaseClient) return;
  if(supabaseChannel){ try{ supabaseClient.removeChannel(supabaseChannel); } catch(e){} }
  supabaseChannel = supabaseClient
    .channel('turtle-cup-live')
    .on('postgres_changes', { event:'*', schema:'public', table: CLOUD_TABLE, filter:`id=eq.${CLOUD_ROW_ID}` }, (payload) => {
      if(!(payload.new && payload.new.data)) return;
      if(pendingLocalChange){
        // We have an edit not yet confirmed on the server — applying this snapshot now would
        // visibly revert what the user just did. Our own pending push supersedes it shortly.
        return;
      }
      applyRemoteState(payload.new.data);
    })
    .subscribe((status) => {
      if(status==='CHANNEL_ERROR' || status==='TIMED_OUT'){
        cloudStatus = 'error'; cloudError = 'Realtime subscription dropped'; renderApp();
      }
    });
}

async function connectSupabase(url, anonKey, { silent } = {}){
  if(!url || !anonKey){
    if(!silent) alert('Enter both the Supabase URL and anon key first.');
    return false;
  }
  if(!window.supabase || !window.supabase.createClient){
    cloudStatus = 'error'; cloudError = 'Supabase SDK failed to load from CDN';
    if(!silent) renderApp();
    return false;
  }
  cloudStatus = 'connecting'; cloudError = '';
  if(!silent) renderApp();

  try{
    const client = window.supabase.createClient(url, anonKey);
    const { data, error } = await client.from(CLOUD_TABLE).select('data').eq('id', CLOUD_ROW_ID).maybeSingle();
    if(error) throw error;

    supabaseClient = client;
    if(data && data.data){
      applyRemoteState(data.data); // adopt whatever's already live in the cloud
    } else {
      await pushCloudState(true); // first device to connect seeds the row
    }
    subscribeRealtime();
    cloudStatus = 'connected'; cloudError = '';
    saveSupabaseConfig({ url, anonKey });
    renderApp();
    return true;
  } catch(e){
    supabaseClient = null;
    cloudStatus = 'error';
    cloudError = e.message || 'Could not reach Supabase — check the URL, key, and that the table exists.';
    renderApp();
    return false;
  }
}

function disconnectSupabase(){
  if(supabaseChannel && supabaseClient){ try{ supabaseClient.removeChannel(supabaseChannel); } catch(e){} }
  supabaseChannel = null;
  supabaseClient = null;
  cloudStatus = 'idle';
  cloudError = '';
  outboxPending = false;
  pendingLocalChange = false;
  clearTimeout(retryTimer);
  clearSupabaseConfig();
  renderApp();
}

/* =========================================================
   CORE GOLF LOGIC
   ========================================================= */
function strokesOnHole(courseHcp, si){
  if(courseHcp == null || courseHcp < 0) return 0;
  const base = Math.floor(courseHcp/18);
  const remainder = courseHcp - base*18; // 0..17
  return base + (si <= remainder ? 1 : 0);
}

function playerById(id){
  return STATE.roster.red.find(p=>p.id===id) || STATE.roster.blue.find(p=>p.id===id) || { id, name:'Unknown', hcp:0 };
}

function getCourse(courseId){
  return STATE.courses.find(c=>c.id===courseId) || STATE.courses[0];
}

function getCourseForMatch(matchId){
  return getCourse(STATE.matchCourse[matchId]);
}

function courseParTotal(course){
  return course.pars.reduce((sum,p)=>sum+p, 0);
}

// USGA formula: Course Handicap = Handicap Index × (Slope / 113) + (Course Rating − Par), rounded.
function courseHandicap18(index, course){
  const par = courseParTotal(course);
  return Math.round(index * (course.slope/113) + (course.rating - par));
}

// Match 3 plays 9 holes — approximated as half the 18-hole course handicap (no separate 9-hole rating on file).
function courseHandicapForMatch(matchId, index, course){
  const ch18 = courseHandicap18(index, course);
  return matchId==='m3' ? Math.round(ch18/2) : ch18;
}

function teamCourseHandicapOf(matchId, ids, course){
  const ch1 = courseHandicapForMatch(matchId, playerById(ids[0]).hcp, course);
  const ch2 = courseHandicapForMatch(matchId, playerById(ids[1]).hcp, course);
  return Math.round((ch1 + ch2)/2);
}

function bestOf(x,y){
  if(x==null && y==null) return null;
  if(x==null) return y;
  if(y==null) return x;
  return Math.min(x,y);
}

function holeWinner(a,b){
  if(a==null || b==null) return null;
  if(a<b) return 'a';
  if(b<a) return 'b';
  return 'halved';
}

function holeRange(matchId){
  return matchId === 'm3' ? { start:9, count:9 } : { start:0, count:18 };
}

// Runs match-play logic over an ordered array of 'a'|'b'|'halved'|null hole results (used per segment)
function playMatch(results){
  const total = results.length;
  let diff = 0;
  let clinch = null;
  let enteredCount = 0;
  let stopped = false;

  for(let i=0;i<total;i++){
    const r = results[i];
    if(stopped || r === null){ if(!stopped) stopped = true; continue; }
    enteredCount++;
    if(r==='a') diff++; else if(r==='b') diff--;
    const holesPlayed = i+1;
    const holesRemaining = total - holesPlayed;
    if(clinch===null && Math.abs(diff) > holesRemaining){
      clinch = { diff, holesPlayed, holesRemaining };
    }
  }

  let final;
  if(clinch){
    const winner = clinch.diff>0 ? 'a' : 'b';
    final = {
      finished:true, winner,
      closeout: `${Math.abs(clinch.diff)}&${clinch.holesRemaining}`,
      pointsA: winner==='a'?1:0, pointsB: winner==='b'?1:0,
    };
  } else if(enteredCount===total){
    const winner = diff>0 ? 'a' : (diff<0 ? 'b' : 'halved');
    final = {
      finished:true, winner,
      closeout: winner==='halved' ? 'Halved' : '1UP',
      pointsA: winner==='a'?1:(winner==='halved'?0.5:0),
      pointsB: winner==='b'?1:(winner==='halved'?0.5:0),
    };
  } else {
    final = { finished:false };
  }
  return { final, currentDiff: diff, enteredCount };
}

// Overall running diff (per hole) purely for the status column of the full scorecard
function runningDiffs(results){
  let diff = 0;
  const out = [];
  for(let i=0;i<results.length;i++){
    const r = results[i];
    if(r===null){ out.push(null); continue; }
    if(r==='a') diff++; else if(r==='b') diff--;
    out.push(diff);
  }
  return out;
}

// 3-point segment engine: Front9/Back9/Overall for 18H matches, Holes1-5/6-9/Overall for the 9H Pinehurst match
function computeSegments(matchId, results){
  const defs = matchId==='m3'
    ? [ { label:'Holes 1–5', s:0, e:5 }, { label:'Holes 6–9', s:5, e:9 }, { label:'Overall', s:0, e:9 } ]
    : [ { label:'Front 9', s:0, e:9 }, { label:'Back 9', s:9, e:18 }, { label:'Overall', s:0, e:18 } ];
  return defs.map(d => ({ label:d.label, ...playMatch(results.slice(d.s, d.e)) }));
}

function segmentPointTotals(segments){
  let a=0, b=0;
  segments.forEach(s => { if(s.final.finished){ a += s.final.pointsA; b += s.final.pointsB; } });
  return { a, b };
}

// Builds full per-hole detail + 3-point segments for one pairing's scorecard
function evaluateMatch(matchId, pairingId){
  const pair = (STATE.lineups[matchId] || []).find(p => p.id === pairingId);
  if(!pair) return null;
  const course = getCourseForMatch(matchId);
  const { start, count } = holeRange(matchId);
  const entry = STATE.scores[matchId][pairingId];
  const holesDetail = [];
  const results = [];

  if(matchId==='m1' || matchId==='m2'){
    const rp1 = playerById(pair.red[0]), rp2 = playerById(pair.red[1]);
    const bp1 = playerById(pair.blue[0]), bp2 = playerById(pair.blue[1]);
    const chR1 = courseHandicapForMatch(matchId, rp1.hcp, course), chR2 = courseHandicapForMatch(matchId, rp2.hcp, course);
    const chB1 = courseHandicapForMatch(matchId, bp1.hcp, course), chB2 = courseHandicapForMatch(matchId, bp2.hcp, course);
    for(let i=0;i<count;i++){
      const si = course.sis[start+i];
      const h = entry.holes[i];
      const a1 = h.a1===''?null:(h.a1 - strokesOnHole(chR1, si));
      const a2 = h.a2===''?null:(h.a2 - strokesOnHole(chR2, si));
      const b1 = h.b1===''?null:(h.b1 - strokesOnHole(chB1, si));
      const b2 = h.b2===''?null:(h.b2 - strokesOnHole(chB2, si));
      const aNet = bestOf(a1,a2), bNet = bestOf(b1,b2);
      const w = holeWinner(aNet,bNet);
      results.push(w);
      holesDetail.push({ hole:start+i+1, par:course.pars[start+i], si, raw:h, a1,a2,b1,b2, aNet, bNet, winner:w });
    }
    var redPlayers=[rp1,rp2], bluePlayers=[bp1,bp2];
    var courseHcps = { red:[chR1,chR2], blue:[chB1,chB2] };
  } else if(matchId==='m3'){
    const chRed = teamCourseHandicapOf(matchId, pair.red, course);
    const chBlue = teamCourseHandicapOf(matchId, pair.blue, course);
    for(let i=0;i<count;i++){
      const si = course.sis[start+i];
      const h = entry.holes[i];
      const aNet = h.a===''?null:(h.a - strokesOnHole(chRed, si));
      const bNet = h.b===''?null:(h.b - strokesOnHole(chBlue, si));
      const w = holeWinner(aNet,bNet);
      results.push(w);
      holesDetail.push({ hole:start+i+1, par:course.pars[start+i], si, raw:h, chRed, chBlue, aNet, bNet, winner:w });
    }
    var redPlayers=[playerById(pair.red[0]), playerById(pair.red[1])];
    var bluePlayers=[playerById(pair.blue[0]), playerById(pair.blue[1])];
    var courseHcps = { red:chRed, blue:chBlue };
  } else if(matchId==='m4'){
    const rp = playerById(pair.red), bp = playerById(pair.blue);
    const chR = courseHandicapForMatch(matchId, rp.hcp, course), chB = courseHandicapForMatch(matchId, bp.hcp, course);
    for(let i=0;i<count;i++){
      const si = course.sis[start+i];
      const h = entry.holes[i];
      const aNet = h.a===''?null:(h.a - strokesOnHole(chR, si));
      const bNet = h.b===''?null:(h.b - strokesOnHole(chB, si));
      const w = holeWinner(aNet,bNet);
      results.push(w);
      holesDetail.push({ hole:start+i+1, par:course.pars[start+i], si, raw:h, rp, bp, aNet, bNet, winner:w });
    }
    var redPlayers=[rp], bluePlayers=[bp];
    var courseHcps = { red:chR, blue:chB };
  }

  const segments = computeSegments(matchId, results);
  const totals = segmentPointTotals(segments);
  const statusPerHole = runningDiffs(results);

  return { pair, course, redPlayers, bluePlayers, holesDetail, segments, totals, statusPerHole, courseHcps };
}

function allPairingIds(matchId){
  return (STATE.lineups[matchId] || []).map(p => p.id);
}

function computeStandings(){
  let red=0, blue=0, totalAvailable=0;
  Object.keys(MATCH_META).forEach(mid => {
    allPairingIds(mid).forEach(pid => {
      totalAvailable += 3;
      const evalr = evaluateMatch(mid, pid);
      if(evalr){ red += evalr.totals.a; blue += evalr.totals.b; }
    });
  });
  return { red, blue, totalAvailable, target: totalAvailable/2 };
}

/* =========================================================
   RENDERING — SHARED HELPERS
   ========================================================= */
function initials(name){ return name.split(' ').map(w=>w[0]).join('').toUpperCase(); }
function displayName(p){
  if(p.nickname && p.nickname.trim()) return p.nickname.trim();
  return p.name.split(' ')[0];
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function pairingLabel(matchId, pair){

function courseBanner(course){

/* =========================================================
   REAL-MONEY ENGINE — buy-in, purse, wagers, settlement
   ========================================================= */
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
function fmtMoney(n){
  const sign = n < -0.005 ? '-' : '';
  return `${sign}$${Math.abs(n).toFixed(2)}`;
}

// Internal engine keeps using lowercase 'front9'|'back9'|'overall' keys (deeply wired into
// computeSegments/evaluateMatch); these translate to/from the persisted SEGMENT_ENUM.
function segLabel(matchId, segment){
  if(segment==='overall') return 'Overall';
  if(matchId==='m3') return segment==='front9' ? 'Holes 1–5' : 'Holes 6–9';
  return segment==='front9' ? 'Front 9' : 'Back 9';
}
function segIndex(segment){ return segment==='front9' ? 0 : segment==='back9' ? 1 : 2; }
function segToEnum(segment){ return segment==='front9' ? SEGMENT_ENUM.FRONT_9 : segment==='back9' ? SEGMENT_ENUM.BACK_9 : SEGMENT_ENUM.OVERALL; }
function segFromEnum(segEnum){ return segEnum===SEGMENT_ENUM.FRONT_9 ? 'front9' : segEnum===SEGMENT_ENUM.BACK_9 ? 'back9' : 'overall'; }

// A Press's `segment` is a descriptive hole-range string (e.g. "HOLES_3-9") rather than a fixed
// FRONT_9/BACK_9/OVERALL enum, since it always covers "the remaining holes of the parent segment".
function pressSegmentLabel(sessionId, parentSegment, startHoleIndex){
  const segDef = sessionId==='m3'
    ? (parentSegment==='front9' ? {s:0,e:5} : parentSegment==='back9' ? {s:5,e:9} : {s:0,e:9})
    : (parentSegment==='front9' ? {s:0,e:9} : parentSegment==='back9' ? {s:9,e:18} : {s:0,e:18});
  const { start } = holeRange(sessionId);
  const startHoleNum = start + startHoleIndex + 1;
  const endHoleNum = start + segDef.e;
  return `HOLES_${startHoleNum}-${endHoleNum}`;
}

function playerStats(playerId){
  const p = playerById(playerId);
  if(p && !p.stats) p.stats = baselinePlayerStats();
  return p ? p.stats : null;
}

// Applies a $ change to a player's running wager net and logs it to the audit ledger.
function applyWagerLedger(playerId, amount, type, description){
  const player = playerById(playerId);
  if(!player || typeof player.wagerBalance !== 'number') return;
  player.wagerBalance = round2(player.wagerBalance + amount);
  STATE.transactionLedger.push({
    transactionId: 'tx'+(nextTxNum++), timestamp: Date.now(), playerId, amount, type, description,
  });
  if(STATE.transactionLedger.length > 500) STATE.transactionLedger = STATE.transactionLedger.slice(-500);
}

// Resolves any ACCEPTED wagers tied to this session+match(pairing) once the relevant segment is decided.
function settleWagersForPairing(sessionId, pairingId){
  const evalr = evaluateMatch(sessionId, pairingId);
  if(!evalr) return;

  STATE.wagers.forEach(w => {
    if(w.status!==WAGER_STATUS.ACCEPTED) return;
    if(w.sessionId!==sessionId || w.matchId!==pairingId) return;

    if(w.wagerType===WAGER_TYPE.MATCH_SEGMENT){
      const seg = evalr.segments[segIndex(segFromEnum(w.segment))];
      if(!seg.final.finished) return;
      if(seg.final.winner==='halved'){
        w.status=WAGER_STATUS.PUSHED; w.winnerId=null; w.settledAt=Date.now();
        return;
      }
      const winnerTeam = seg.final.winner==='a' ? 'RED' : 'BLUE';
      const creatorWon = w.targetTeam===winnerTeam;
      const winnerId = creatorWon ? w.creatorId : w.acceptorId;
      const loserId = creatorWon ? w.acceptorId : w.creatorId;
      applyWagerLedger(winnerId, w.amount, TX_TYPE.WAGER_WIN, `Won ${fmtMoney(w.amount)} vs ${displayName(playerById(loserId))} — ${MATCH_META[sessionId].label} ${segLabel(sessionId, segFromEnum(w.segment))}`);
      applyWagerLedger(loserId, -w.amount, TX_TYPE.WAGER_LOSS, `Lost ${fmtMoney(w.amount)} vs ${displayName(playerById(winnerId))} — ${MATCH_META[sessionId].label} ${segLabel(sessionId, segFromEnum(w.segment))}`);
      const ws = playerStats(winnerId), ls = playerStats(loserId);
      if(ws) ws.wagersWon += 1;
      if(ls) ls.wagersLost += 1;
      w.status=WAGER_STATUS.SETTLED; w.winnerId=winnerId; w.settledAt=Date.now();

    } else if(w.wagerType===WAGER_TYPE.PRESS){
      const parentSeg = w.parentSegment;
      const segDef = sessionId==='m3'
        ? (parentSeg==='front9' ? {s:0,e:5} : parentSeg==='back9' ? {s:5,e:9} : {s:0,e:9})
        : (parentSeg==='front9' ? {s:0,e:9} : parentSeg==='back9' ? {s:9,e:18} : {s:0,e:18});
      const results = evalr.holesDetail.slice(segDef.s, segDef.e).map(h=>h.winner);
      const pressResults = results.slice(w.startHoleIndex - segDef.s);
      const played = playMatch(pressResults);
      if(!played.final.finished) return;
      if(played.final.winner==='halved'){ w.status=WAGER_STATUS.PUSHED; w.winnerId=null; w.settledAt=Date.now(); return; }

      const winTeam = played.final.winner==='a' ? 'red' : 'blue';
      const loseTeam = winTeam==='red' ? 'blue' : 'red';
      const teamPlayers = (team) => sessionId==='m4'
        ? [team==='red'?evalr.redPlayers[0]:evalr.bluePlayers[0]]
        : (team==='red'?evalr.redPlayers:evalr.bluePlayers);
      teamPlayers(winTeam).forEach(p => applyWagerLedger(p.id, w.amount, TX_TYPE.WAGER_WIN, `Won the Press ${fmtMoney(w.amount)} — ${MATCH_META[sessionId].label} ${w.segment}`));
      teamPlayers(loseTeam).forEach(p => applyWagerLedger(p.id, -w.amount, TX_TYPE.WAGER_LOSS, `Lost the Press ${fmtMoney(w.amount)} — ${MATCH_META[sessionId].label} ${w.segment}`));
      teamPlayers(winTeam).forEach(p => { const s=playerStats(p.id); if(s) s.wagersWon += 1; });
      teamPlayers(loseTeam).forEach(p => { const s=playerStats(p.id); if(s) s.wagersLost += 1; });
      w.status=WAGER_STATUS.SETTLED; w.winnerId=null; w.targetTeam=winTeam.toUpperCase(); w.settledAt=Date.now();
    }
    // PROP wagers aren't tied to one pairing finishing — settled via the admin "settle-prop"
    // action in Wager Central once the tournament-wide outcome (medalist/birdie king/custom) is known.
  });
}

function settleAllWagers(){
  Object.keys(MATCH_META).forEach(mid => {
    allPairingIds(mid).forEach(pid => settleWagersForPairing(mid, pid));
  });
}

// ---- Purse: buy-in pool split across Winning Team / Low Net Medalist / Trophy (Birdie King) ----
function computePursePayouts(){
  const allPlayers = [...STATE.roster.red, ...STATE.roster.blue];
  const totalPlayers = allPlayers.length;
  const cfg = STATE.purseConfig;
  const totalPurse = round2(cfg.buyInPerPlayer * totalPlayers);
  const winningPool = round2(totalPurse * cfg.winningTeamPct / 100);
  const medalistPool = round2(totalPurse * cfg.medalistPct / 100);
  const trophyPool = round2(totalPurse * cfg.trophyPoolPct / 100);

  const payouts = {}; const notes = {};
  allPlayers.forEach(p => { payouts[p.id] = 0; notes[p.id] = []; });

  const standings = computeStandings();
  let winningSide = null;
  if(standings.red > standings.blue) winningSide = 'red';
  else if(standings.blue > standings.red) winningSide = 'blue';

  if(winningSide){
    const team = STATE.roster[winningSide];
    const share = team.length ? round2(winningPool / team.length) : 0;
    team.forEach(p => { payouts[p.id] += share; notes[p.id].push(`Winning team share: ${fmtMoney(share)}`); });
  } else if(totalPlayers){
    const share = round2(winningPool / totalPlayers);
    allPlayers.forEach(p => { payouts[p.id] += share; notes[p.id].push(`Standings tied — split evenly: ${fmtMoney(share)}`); });
  }

  const metrics = computeSessionMetrics(Object.keys(MATCH_META));
  if(metrics.medalist && metrics.medalist.id){
    payouts[metrics.medalist.id] += medalistPool;
    notes[metrics.medalist.id].push(`Low Net Medalist pool: ${fmtMoney(medalistPool)}`);
  } else if(totalPlayers){
    const share = round2(medalistPool / totalPlayers);
    allPlayers.forEach(p => { payouts[p.id] += share; notes[p.id].push(`No medalist yet — split evenly: ${fmtMoney(share)}`); });
  }

  if(metrics.birdieKing && metrics.birdieKing.id){
    payouts[metrics.birdieKing.id] += trophyPool;
    notes[metrics.birdieKing.id].push(`Birdie King trophy pool: ${fmtMoney(trophyPool)}`);
  } else if(totalPlayers){
    const share = round2(trophyPool / totalPlayers);
    allPlayers.forEach(p => { payouts[p.id] += share; notes[p.id].push(`No individual birdie king yet — split evenly: ${fmtMoney(share)}`); });
  }

  return {
    totalPurse, winningPool, medalistPool, trophyPool, payouts, notes, winningSide,
    medalistId: metrics.medalist ? metrics.medalist.id : null,
    birdieKingId: metrics.birdieKing ? metrics.birdieKing.id : null,
  };
}

// Buy-In (paid in, negative) + Purse Share (paid out) + Wager Net = Final Net Balance.
function computeFinalNetBalances(){
  const purse = computePursePayouts();
  const allPlayers = [...STATE.roster.red, ...STATE.roster.blue];
  const rows = allPlayers.map(p => {
    const buyIn = STATE.purseConfig.buyInPerPlayer;
    const purseShare = purse.payouts[p.id] || 0;
    const wagerNet = p.wagerBalance || 0;
    const finalNet = round2(purseShare - buyIn + wagerNet);
    return { player: p, buyIn, purseShare, wagerNet, finalNet, notes: purse.notes[p.id] || [] };
  });
  return { rows, purse };
}

// Greedy min-transaction debt settlement: repeatedly matches the biggest creditor against the
// biggest debtor. Standard "simplify debts" approach (same idea Splitwise uses) — not formally
// provably minimal for every possible distribution, but matches or beats it in practice and is
// simple enough to audit by hand.
function computeSettlementTransactions(rows){
  const creditors = rows.filter(r => r.finalNet > 0.005).map(r => ({ id:r.player.id, name:displayName(r.player), amt:r.finalNet })).sort((a,b)=>b.amt-a.amt);
  const debtors = rows.filter(r => r.finalNet < -0.005).map(r => ({ id:r.player.id, name:displayName(r.player), amt:-r.finalNet })).sort((a,b)=>b.amt-a.amt);
  const txns = [];
  let ci=0, di=0;
  while(ci<creditors.length && di<debtors.length){
    const c=creditors[ci], d=debtors[di];
    const amt = round2(Math.min(c.amt, d.amt));
    if(amt>0.005) txns.push({ fromId:d.id, fromName:d.name, toId:c.id, toName:c.name, amount:amt });
    c.amt = round2(c.amt-amt); d.amt = round2(d.amt-amt);
    if(c.amt<=0.005) ci++;
    if(d.amt<=0.005) di++;
  }
  return txns;
}

function venmoDeepLink(handle, amount, note){
  const clean = (handle||'').replace(/^@/,'').trim();
  const params = `txn=pay&amount=${amount.toFixed(2)}&note=${encodeURIComponent(note)}`;
  return clean ? `venmo://paycharge?recipients=${encodeURIComponent(clean)}&${params}` : `https://venmo.com/`;
}
function venmoWebLink(handle){
  const clean = (handle||'').replace(/^@/,'').trim();
  return clean ? `https://venmo.com/u/${encodeURIComponent(clean)}` : `https://venmo.com/`;
}

  const totalForBar = Math.max(st.totalAvailable, 1);
  const redPct = (st.red/totalForBar)*100;
  const bluePct = (st.blue/totalForBar)*100;

  return `
  <div class="shell-pattern border-b border-[#1c2a20] bg-gradient-to-b from-[#0f1a13] to-[#0a100c]">

      <div>
        <div class="flex items-center gap-2">
          <span class="text-2xl">🐢</span>
          <h1 class="font-display font-700 text-xl tracking-tight">Turtle Cup</h1>
        </div>
        <p class="text-[11px] text-[#7f9689] mt-0.5">Multi-Course Ryder Cup Format</p>
        <div class="flex items-center gap-1.5 mt-1.5">
          <span class="w-1.5 h-1.5 rounded-full ${syncDot}"></span>
          <span class="text-[10px] font-medium ${syncText}">${syncLabel}</span>
          ${lastSavedAt ? `<span class="text-[10px] text-[#5c6f61]">· ${formatClock(lastSavedAt)}</span>` : ''}
        </div>

      <div class="flex gap-1.5 flex-shrink-0">
        <button data-action="open-recap" title="Launch Post-Match Recap" class="text-[11px] px-2.5 py-1.5 rounded-lg bg-[#241a0c] border border-[#7d6a2f] text-[#f2d17f] hover:border-[#d9b25c] active:scale-95 transition">📺 Recap</button>
        <button data-tab="admin" title="Admin Panel" class="text-[11px] px-2.5 py-1.5 rounded-lg border active:scale-95 transition ${STATE.ui.tab==='admin' ? 'tab-active' : 'bg-[#16241b] border-[#243527] text-[#c9d8cd] hover:border-[#3fae6a]'}">${adminAuthenticated ? '🔓' : '🔐'} Admin</button>
        ${adminAuthenticated ? `<button data-action="lock-admin" title="Lock Admin Mode" class="text-[11px] w-8 h-8 flex items-center justify-center rounded-lg border bg-[#3a2f12] border-[#d9b25c] text-[#f2d17f] active:scale-95 transition">🔒</button>` : ''}
      </div>
    </div>

    <div class="px-4 pb-4">
      <div class="flex items-end justify-between">
        <div class="text-left">
          <div class="text-[11px] font-semibold" style="color:${RED}">${escapeHtml(STATE.teamNames.red)}</div>
          <div class="font-display font-700 text-3xl leading-none" style="color:${RED}">${st.red.toFixed(1)}</div>
        </div>
        <div class="text-center pb-1">
          <div class="text-[9px] uppercase tracking-wider text-[#7f9689]">Target to Win</div>
          <div class="font-display font-600 text-sm text-[#d9b25c]">${st.target.toFixed(1)}</div>
        </div>
        <div class="text-right">
          <div class="text-[11px] font-semibold" style="color:${BLUE}">${escapeHtml(STATE.teamNames.blue)}</div>
          <div class="font-display font-700 text-3xl leading-none" style="color:${BLUE}">${st.blue.toFixed(1)}</div>
        </div>
      </div>
      <div class="flex h-2 rounded-full overflow-hidden bg-[#161f1a] mt-2 border border-[#243527]">
        <div style="width:${redPct}%; background:${RED}"></div>
        <div class="flex-1"></div>
        <div style="width:${bluePct}%; background:${BLUE}"></div>
      </div>
      <div class="text-[10px] text-[#5c6f61] mt-1 text-center">${st.totalAvailable.toFixed(1)} points scheduled across ${Object.keys(MATCH_META).reduce((n,m)=>n+allPairingIds(m).length,0)} matchups</div>
    </div>

    ${adminAuthenticated ? renderAdminMaintenancePanel() : ''}
  </div>`;
}

      <label class="text-[11px] px-2.5 py-1.5 rounded-lg bg-[#16241b] border border-[#243527] text-[#c9d8cd] hover:border-[#3fae6a] active:scale-95 transition cursor-pointer">

/* =========================================================
   RENDERING — NAV
   ========================================================= */
function renderNav(){
  const tabs = [
    ...Object.values(MATCH_META).map(m=>({ id:m.id, label:m.label })),
    { id:'wagers', label:'🎲 Wagers' },
    { id:'settlement', label:'🤝 Settle' },

        <button data-tab="${t.id}" class="text-xs font-semibold px-3.5 py-2 rounded-lg transition whitespace-nowrap ${STATE.ui.tab===t.id ? 'tab-active' : 'tab-inactive bg-[#111c15] border border-[#1f2f26] hover:border-[#3fae6a]'}">${t.label}</button>

function pillRow(items, selectedIdx, groupAttr){
  if(items.length<=1) return '';
  return `<div class="px-4 pt-3 flex gap-2 overflow-x-auto">${items.map((label,i)=>`
    <button ${groupAttr}="${i}" class="flex-shrink-0 text-xs font-medium px-3 py-1.5 rounded-full border transition ${i===selectedIdx ? 'bg-[#3fae6a] text-[#0a100c] border-[#3fae6a]' : 'bg-[#111c15] text-[#9db3a4] border-[#243527] hover:border-[#3fae6a]'}">${label}</button>
  `).join('')}</div>`;
}

/* =========================================================
   RENDERING — MATCH SCORECARDS
   ========================================================= */
function segmentBadges(segments){
  const toneClasses = {
    decided: 'bg-[#123a22] border-[#2f7d4f] text-[#7be6a4]',
    halved: 'bg-[#3a2f12] border-[#7d6a2f] text-[#f2d17f]',
    live: 'bg-[#132436] border-[#2f5a7d] text-[#8fc4f2]',
    idle: 'bg-[#161f1a] border-[#243527] text-[#9db3a4]',
  };
  const cells = segments.map(s => {
    const f = s.final;
    let text, tone, pts;
    if(f.finished){
      if(f.winner==='halved'){ text='Halved'; tone='halved'; }
      else { text = `${f.winner==='a'?'RED':'BLUE'} ${f.closeout}`; tone='decided'; }
      pts = `${f.pointsA.toFixed(1)}–${f.pointsB.toFixed(1)}`;
    } else if(s.enteredCount===0){
      text='Not started'; tone='idle'; pts='0.0–0.0';
    } else if(s.currentDiff===0){
      text=`AS thru ${s.enteredCount}`; tone='idle'; pts='0.0–0.0';
    } else {
      text = `${s.currentDiff>0?'RED':'BLUE'} ${Math.abs(s.currentDiff)}up`; tone='live'; pts='0.0–0.0';
    }
    return `<div class="rounded-lg border px-2 py-2 text-center ${toneClasses[tone]}">
      <div class="text-[9px] uppercase tracking-wide opacity-70">${s.label}</div>
      <div class="text-[11px] font-display font-600 mt-0.5">${text}</div>
      <div class="text-[10px] mt-0.5 opacity-80">${pts} pts</div>
    </div>`;
  }).join('');
  return `<div class="mx-4 mt-3 grid grid-cols-3 gap-2 fade-in">${cells}</div>`;
}

// A scorecard is only ready to auto-lock once every relevant raw score is in — mathematically
// clinching the Overall match early (5&4, 8&7, etc.) does NOT by itself stop score entry, so Back 9
// points, Press wagers, and tournament-wide Low Net totals can still be completed on the holes
// still to be played.
function allHolesEntered(matchId, holesDetail){
  return holesDetail.every(h => (matchId==='m1' || matchId==='m2')
    ? (h.raw.a1!=='' && h.raw.a2!=='' && h.raw.b1!=='' && h.raw.b2!=='')
    : (h.raw.a!=='' && h.raw.b!==''));
}

function lockNote(locked, overallDecided, scorecardComplete, manuallyFinalized){
  const bits = [];
  if(overallDecided && !scorecardComplete && !manuallyFinalized){
    bits.push(`<div class="mx-4 mt-2 text-[10px] text-[#8fc4f2]">🏁 Overall match decided — hole entry stays open so Back 9 points, Press wagers, and Low Net totals can still be completed. An admin can finalize early to lock now.</div>`);
  }
  if(locked){
    bits.push(`<div class="mx-4 mt-2 text-[10px] text-[#7f9689]">🔒 ${manuallyFinalized ? 'Finalized by admin' : 'All holes entered'} — scorecard locked. Enable Admin Mode to override.</div>`);
  } else if(scorecardComplete || manuallyFinalized){
    bits.push(`<div class="mx-4 mt-2 text-[10px] text-[#f2d17f]">✏️ Admin Override active — this scorecard is editable even though it's ${manuallyFinalized ? 'finalized' : 'complete'}.</div>`);
  }
  return bits.join('');
}

function finalizeToggleButton(matchId, pairingId, manuallyFinalized){
  if(!adminAuthenticated) return '';
  return `
  <div class="mx-4 mt-2">
    <button data-action="toggle-finalize" data-match="${matchId}" data-pairing="${pairingId}"
      class="w-full text-[11px] font-semibold py-2 rounded-lg border active:scale-95 transition ${manuallyFinalized ? 'bg-[#2a1418] border-[#7d2f3a] text-[#f2a1ab]' : 'bg-[#16241b] border-[#243527] text-[#c9d8cd] hover:border-[#3fae6a]'}">
      ${manuallyFinalized ? '↺ Reopen Scorecard' : '🏁 Finalize Scorecard Now (match conceded — skip remaining holes)'}
    </button>
  </div>`;
}

/* ---------------------------------------------------------
   Mobile single-hole scoring card — shared building blocks
   --------------------------------------------------------- */
function clampHole(matchId, holeCount){
  const cur = STATE.ui.hole[matchId] ?? 0;
  return Math.max(0, Math.min(cur, holeCount-1));
}

function holeStepper(matchId, curHole, holeCount){
  return `
  <div class="mx-4 mt-3 flex items-center justify-between gap-3">
    <button data-action="prev-hole" data-match="${matchId}" ${curHole<=0?'disabled':''}
      class="w-11 h-11 flex-shrink-0 rounded-full bg-[#16241b] border border-[#243527] text-xl text-[#eef3ee] flex items-center justify-center active:scale-90 transition disabled:opacity-25 disabled:cursor-not-allowed">‹</button>
    <div class="text-[11px] text-[#7f9689] font-medium">Hole ${curHole+1} of ${holeCount}</div>
    <button data-action="next-hole" data-match="${matchId}" ${curHole>=holeCount-1?'disabled':''}
      class="w-11 h-11 flex-shrink-0 rounded-full bg-[#16241b] border border-[#243527] text-xl text-[#eef3ee] flex items-center justify-center active:scale-90 transition disabled:opacity-25 disabled:cursor-not-allowed">›</button>
  </div>`;
}

function holeHeaderCard(h){
  return `
  <div class="mx-4 mt-2 rounded-2xl bg-gradient-to-b from-[#132018] to-[#0f1913] border border-[#1f2f26] px-4 py-4 text-center fade-in">
    <div class="text-[9px] uppercase tracking-[0.2em] text-[#7f9689]">Hole</div>
    <div class="font-display font-700 text-5xl leading-none mt-1 text-[#eef3ee]">${h.hole}</div>
    <div class="flex items-center justify-center gap-5 mt-2.5 text-xs text-[#9db3a4]">
      <span>Par&nbsp;<b class="text-[#eef3ee] font-display">${h.par}</b></span>
      <span class="w-px h-3 bg-[#243527]"></span>
      <span>Hole HCP&nbsp;<b class="text-[#eef3ee] font-display">${h.si}</b></span>
    </div>
  </div>`;
}

function holeDotStrip(matchId, holesDetail, curHole){
  const dots = holesDetail.map((hh,i) => {
    const isCurrent = i===curHole;
    let bg = '#161f1a', border = '#243527', color = '#7f9689';
    if(isCurrent){ bg = '#3fae6a'; border = '#3fae6a'; color = '#0a100c'; }
    else if(hh.winner==='a'){ bg = 'rgba(251,106,106,0.18)'; border = RED; color = RED; }
    else if(hh.winner==='b'){ bg = 'rgba(90,169,242,0.18)'; border = BLUE; color = BLUE; }
    else if(hh.winner==='halved'){ bg = 'rgba(217,178,92,0.18)'; border = '#d9b25c'; color = '#d9b25c'; }
    return `<button data-action="goto-hole" data-match="${matchId}" data-hole="${i}"
      class="flex-shrink-0 w-8 h-8 rounded-full text-[11px] font-display font-600 flex items-center justify-center border active:scale-90 transition"
      style="background:${bg}; border-color:${border}; color:${color};">${hh.hole}</button>`;
  }).join('');
  return `<div class="mx-4 mt-3 flex gap-1.5 overflow-x-auto pb-1">${dots}</div>`;
}

function strokeDots(strokes){
  if(strokes<=0) return '';
  const dots = Array.from({length: Math.min(strokes,2)}).map(()=>`<span class="text-[9px] text-[#d9b25c]">●</span>`).join('');
  return `<span class="flex-shrink-0 inline-flex items-center gap-0.5 ml-1.5" title="Receives ${strokes} stroke${strokes>1?'s':''} this hole">${dots}</span>`;
}

function counterRow(name, subLabel, value, par, strokes, dataAttrs, locked, color){
  const display = value === '' ? '–' : value;
  return `
  <div class="flex items-center justify-between gap-2 bg-[#0f1913] border border-[#1f2f26] rounded-xl px-3 py-2.5">
    <div class="flex items-center gap-2 min-w-0">
      <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:${color}"></span>
      <div class="min-w-0">
        <div class="font-display font-600 text-sm truncate flex items-center">${escapeHtml(name)}${strokeDots(strokes)}</div>
        ${subLabel ? `<div class="text-[10px] text-[#7f9689] truncate">${escapeHtml(subLabel)}</div>` : ''}
      </div>
    </div>
    <div class="flex items-center gap-2 flex-shrink-0">
      <button ${locked?'disabled':''} data-action="score-adjust" ${dataAttrs} data-delta="-1"
        class="w-11 h-11 rounded-full bg-[#16241b] border border-[#243527] text-xl font-display font-700 text-[#eef3ee] flex items-center justify-center active:scale-90 transition disabled:opacity-25 disabled:cursor-not-allowed">−</button>
      <div class="w-8 text-center font-display font-700 text-2xl text-[#eef3ee]">${display}</div>
      <button ${locked?'disabled':''} data-action="score-set-par" ${dataAttrs} title="Set to Par (${par})"
        class="h-11 px-2.5 rounded-lg bg-[#16241b] border border-[#3fae6a] text-[10px] font-display font-700 tracking-wide text-[#7be6a4] flex items-center justify-center active:scale-90 transition disabled:opacity-25 disabled:cursor-not-allowed">PAR</button>
      <button ${locked?'disabled':''} data-action="score-adjust" ${dataAttrs} data-delta="1"
        class="w-11 h-11 rounded-full bg-[#3fae6a] text-[#0a100c] text-xl font-display font-700 flex items-center justify-center active:scale-90 transition disabled:opacity-25 disabled:cursor-not-allowed">+</button>
    </div>
  </div>`;
}

function resultToneClass(tone){
  const map = {
    red: 'bg-[#3a1220] border-[#7d2f3a] text-[#f2a1ab]',
    blue: 'bg-[#132436] border-[#2f5a7d] text-[#8fc4f2]',
    halved: 'bg-[#3a2f12] border-[#7d6a2f] text-[#f2d17f]',
    idle: 'bg-[#161f1a] border-[#243527] text-[#9db3a4]',
  };
  return map[tone] || map.idle;
}

function holeResultStrip(h){
  let text, tone;
  if(h.winner===null){ text = 'Enter both sides\' scores to see the hole result'; tone = 'idle'; }
  else if(h.winner==='halved'){ text = `Hole halved — both net ${h.aNet}`; tone = 'halved'; }
  else {
    const winnerName = h.winner==='a' ? STATE.teamNames.red : STATE.teamNames.blue;
    text = `${escapeHtml(winnerName)} win the hole — net ${h.aNet} vs ${h.bNet}`;
    tone = h.winner==='a' ? 'red' : 'blue';
  }
  return `<div class="mx-4 mt-3 rounded-xl border px-3 py-2.5 text-center text-xs font-medium fade-in ${resultToneClass(tone)}">${text}</div>`;
}

function sectionLabel(text, color){
  return `<div class="text-[9px] uppercase tracking-widest font-semibold mt-2.5 mb-1.5 first:mt-0" style="color:${color}">${escapeHtml(text)}</div>`;
}

/* ---------------------------------------------------------
   Wager display + Press action — shared across hole cards
   --------------------------------------------------------- */
function activeWagersForPairing(sessionId, pairingId){
  return STATE.wagers.filter(w => w.sessionId===sessionId && w.matchId===pairingId && (w.status===WAGER_STATUS.ACCEPTED || w.status===WAGER_STATUS.OPEN));
}

function wagerLineText(w){
  if(w.wagerType===WAGER_TYPE.MATCH_SEGMENT){
    const pickTeam = w.targetTeam==='RED' ? STATE.teamNames.red : STATE.teamNames.blue;
    const pendingTag = w.status===WAGER_STATUS.OPEN ? ' · awaiting accept' : '';
    return `💵 ${escapeHtml(displayName(playerById(w.creatorId)))} vs ${escapeHtml(displayName(playerById(w.acceptorId)))} — ${fmtMoney(w.amount)} on ${escapeHtml(pickTeam)} (${segLabel(w.sessionId, segFromEnum(w.segment))})${pendingTag}`;
  }
  if(w.wagerType===WAGER_TYPE.PRESS){
    const team = w.targetTeam==='RED' ? STATE.teamNames.red : STATE.teamNames.blue;
    return `🎲 Press by ${escapeHtml(team)} — ${fmtMoney(w.amount)} (${w.segment})`;
  }
  return '';
}

function activeWagersStrip(sessionId, pairingId){
  const list = activeWagersForPairing(sessionId, pairingId);
  if(list.length===0) return '';
  return `<div class="mx-4 mt-3 space-y-1.5">${list.map(w=>`
    <div class="rounded-lg border border-[#3a2f12] bg-[#1a1408] px-3 py-2 text-[11px] text-[#f2d17f] font-medium">${wagerLineText(w)}</div>
  `).join('')}</div>`;
}

// Trailing side can Press once down 2+ within the segment containing the current hole (Overall excluded — press is a "within the nine" bet).
function pressEligibility(sessionId, pairingId, segments, curHole){
  const segKey = sessionId==='m3' ? (curHole<5 ? 'front9':'back9') : (curHole<9 ? 'front9':'back9');
  const seg = segments[segIndex(segKey)];
  if(seg.final.finished) return null;
  const pressingSide = seg.currentDiff>=2 ? 'blue' : (seg.currentDiff<=-2 ? 'red' : null);
  if(!pressingSide) return null;
  const dup = STATE.wagers.some(w => w.wagerType===WAGER_TYPE.PRESS && w.sessionId===sessionId && w.matchId===pairingId && w.parentSegment===segKey && w.status===WAGER_STATUS.ACCEPTED);
  if(dup) return null;
  return { segKey, pressingSide };
}

function pressButton(sessionId, pairingId, segments, curHole){
  const elig = pressEligibility(sessionId, pairingId, segments, curHole);
  if(!elig) return '';
  const teamName = elig.pressingSide==='red' ? STATE.teamNames.red : STATE.teamNames.blue;
  const amt = STATE.purseConfig.defaultPressAmount || 20;
  return `
  <div class="mx-4 mt-3">
    <button data-action="initiate-press" data-match="${sessionId}" data-pairing="${pairingId}" data-segment="${elig.segKey}" data-hole="${curHole}" data-side="${elig.pressingSide}"
      class="w-full text-xs font-semibold py-2.5 rounded-xl border active:scale-95 transition"
      style="background:rgba(217,178,92,0.12); border-color:#7d6a2f; color:#f2d17f;">
      🎲 ${escapeHtml(teamName)} is down 2 — Press for ${fmtMoney(amt)}?
    </button>
  </div>`;
}

/* ---------------------------------------------------------
   Format-specific hole cards
   --------------------------------------------------------- */
function renderBetterBallHoleCard(matchId, pairingId){
  const evalr = evaluateMatch(matchId, pairingId);
  const { redPlayers, bluePlayers, holesDetail, segments, courseHcps } = evalr;
  const overallDecided = segments[2].final.finished;
  const scorecardComplete = allHolesEntered(matchId, holesDetail);
  const manuallyFinalized = STATE.scores[matchId][pairingId].finalized === true;
  const locked = (scorecardComplete || manuallyFinalized) && !adminAuthenticated;
  const holeCount = holesDetail.length;
  const curHole = clampHole(matchId, holeCount);
  const h = holesDetail[curHole];

  const sA1 = strokesOnHole(courseHcps.red[0], h.si);
  const sA2 = strokesOnHole(courseHcps.red[1], h.si);
  const sB1 = strokesOnHole(courseHcps.blue[0], h.si);
  const sB2 = strokesOnHole(courseHcps.blue[1], h.si);

  const attrs = role => `data-match="${matchId}" data-pairing="${pairingId}" data-hole="${curHole}" data-role="${role}" data-par="${h.par}"`;

  return `
  ${holeStepper(matchId, curHole, holeCount)}
  ${holeHeaderCard(h)}
  ${segmentBadges(segments)}
  ${lockNote(locked, overallDecided, scorecardComplete, manuallyFinalized)}
  ${finalizeToggleButton(matchId, pairingId, manuallyFinalized)}
  ${activeWagersStrip(matchId, pairingId)}
  <div class="mx-4 mt-3">
    ${sectionLabel(STATE.teamNames.red, RED)}
    <div class="space-y-2">
      ${counterRow(displayName(redPlayers[0]), null, h.raw.a1, h.par, sA1, attrs('a1'), locked, RED)}
      ${counterRow(displayName(redPlayers[1]), null, h.raw.a2, h.par, sA2, attrs('a2'), locked, RED)}
    </div>
    ${sectionLabel(STATE.teamNames.blue, BLUE)}
    <div class="space-y-2">
      ${counterRow(displayName(bluePlayers[0]), null, h.raw.b1, h.par, sB1, attrs('b1'), locked, BLUE)}
      ${counterRow(displayName(bluePlayers[1]), null, h.raw.b2, h.par, sB2, attrs('b2'), locked, BLUE)}
    </div>
  </div>
  ${pressButton(matchId, pairingId, segments, curHole)}
  ${holeResultStrip(h)}
  ${holeDotStrip(matchId, holesDetail, curHole)}
  <p class="mx-4 mt-3 mb-4 text-[10px] text-[#66786b]">Net = Gross − strokes received (Course Handicap vs. this course's hole SI). Better Ball net = lower of the pair's two net scores. Gold dots mark players receiving a stroke here. Each match awards up to 3.0 pts: Front 9 (1.0) + Back 9 (1.0) + Overall (1.0).</p>`;
}

function renderPinehurstHoleCard(matchId, pairingId){
  const evalr = evaluateMatch(matchId, pairingId);
  const { holesDetail, segments, courseHcps } = evalr;
  const finished = segments[2].final.finished;
  const overallDecided = segments[2].final.finished;
  const scorecardComplete = allHolesEntered(matchId, holesDetail);
  const manuallyFinalized = STATE.scores[matchId][pairingId].finalized === true;
  const locked = (scorecardComplete || manuallyFinalized) && !adminAuthenticated;
  const holeCount = holesDetail.length;
  const curHole = clampHole(matchId, holeCount);
  const h = holesDetail[curHole];

  const sRed = strokesOnHole(courseHcps.red, h.si);
  const sBlue = strokesOnHole(courseHcps.blue, h.si);
  const attrs = role => `data-match="${matchId}" data-pairing="${pairingId}" data-hole="${curHole}" data-role="${role}" data-par="${h.par}"`;

  return `
  ${holeStepper(matchId, curHole, holeCount)}
  ${holeHeaderCard(h)}
  ${segmentBadges(segments)}
  ${lockNote(locked, overallDecided, scorecardComplete, manuallyFinalized)}
  ${finalizeToggleButton(matchId, pairingId, manuallyFinalized)}
  ${activeWagersStrip(matchId, pairingId)}
  <div class="mx-4 mt-3 flex gap-3 text-[11px] text-[#9db3a4]">
    <span>9-Hole Team Course Handicap — <b style="color:${RED}">${escapeHtml(STATE.teamNames.red)}: ${courseHcps.red}</b></span>
    <span><b style="color:${BLUE}">${escapeHtml(STATE.teamNames.blue)}: ${courseHcps.blue}</b></span>
  </div>
  <div class="mx-4 mt-2 space-y-2">
    ${counterRow(STATE.teamNames.red, 'Alternate-shot team score', h.raw.a, h.par, sRed, attrs('a'), locked, RED)}
    ${counterRow(STATE.teamNames.blue, 'Alternate-shot team score', h.raw.b, h.par, sBlue, attrs('b'), locked, BLUE)}
  </div>
  ${pressButton(matchId, pairingId, segments, curHole)}
  ${holeResultStrip(h)}
  ${holeDotStrip(matchId, holesDetail, curHole)}
  <p class="mx-4 mt-3 mb-4 text-[10px] text-[#66786b]">Pinehurst/Chapman: each player's 9-hole Course Handicap ≈ (Index × Slope/113 + Rating − Par) ÷ 2, then the pair's two 9-hole handicaps are combined ÷ 2 for one team number. Points: Holes 1–5 (1.0) + Holes 6–9 (1.0) + Overall (1.0).</p>`;
}

function renderSinglesHoleCard(matchId, pairingId){
  const evalr = evaluateMatch(matchId, pairingId);
  const { redPlayers, bluePlayers, holesDetail, segments, courseHcps } = evalr;
  const overallDecided = segments[2].final.finished;
  const scorecardComplete = allHolesEntered(matchId, holesDetail);
  const manuallyFinalized = STATE.scores[matchId][pairingId].finalized === true;
  const locked = (scorecardComplete || manuallyFinalized) && !adminAuthenticated;
  const holeCount = holesDetail.length;
  const curHole = clampHole(matchId, holeCount);
  const h = holesDetail[curHole];
  const rp = redPlayers[0], bp = bluePlayers[0];

  const sRed = strokesOnHole(courseHcps.red, h.si);
  const sBlue = strokesOnHole(courseHcps.blue, h.si);
  const attrs = role => `data-match="${matchId}" data-pairing="${pairingId}" data-hole="${curHole}" data-role="${role}" data-par="${h.par}"`;

  return `
  ${holeStepper(matchId, curHole, holeCount)}
  ${holeHeaderCard(h)}
  ${segmentBadges(segments)}
  ${lockNote(locked, overallDecided, scorecardComplete, manuallyFinalized)}
  ${finalizeToggleButton(matchId, pairingId, manuallyFinalized)}
  ${activeWagersStrip(matchId, pairingId)}
  <div class="mx-4 mt-3 space-y-2">
    ${counterRow(displayName(rp), rp.name, h.raw.a, h.par, sRed, attrs('a'), locked, RED)}
    ${counterRow(displayName(bp), bp.name, h.raw.b, h.par, sBlue, attrs('b'), locked, BLUE)}
  </div>
  ${pressButton(matchId, pairingId, segments, curHole)}
  ${holeResultStrip(h)}
  ${holeDotStrip(matchId, holesDetail, curHole)}
  <p class="mx-4 mt-3 mb-4 text-[10px] text-[#66786b]">Course Handicap = Index × (Slope/113) + (Rating − Par), applied hole-by-hole using this course's SI. Points: Front 9 (1.0) + Back 9 (1.0) + Overall (1.0) — up to 3.0 pts per singles match.</p>`;
}


function renderMatchTab(matchId){
  const meta = MATCH_META[matchId];
  const pairs = STATE.lineups[matchId] || [];
  const course = getCourseForMatch(matchId);

  let header = `
  <div class="px-4 pt-4">
    <h2 class="font-display font-700 text-lg">${meta.label}</h2>
    <p class="text-xs text-[#7f9689]">${meta.sub}</p>
  </div>
  ${courseBanner(course)}`;

  if(pairs.length===0){
    return header + `<p class="mx-4 mt-4 text-sm text-[#7f9689]">No pairings set for this match yet. Go to the <b>Admin</b> tab to build the lineup.</p>`;
  }

  const pairIdx = Math.min(STATE.ui.pairing[matchId] || 0, pairs.length-1);
  const activePairingId = pairs[pairIdx].id;

  let body = pillRow(pairs.map(p=>pairingLabel(matchId,p)), pairIdx, `data-pairing-select-${matchId}`);

  if(matchId==='m3') body += renderPinehurstHoleCard(matchId, activePairingId);
  else if(matchId==='m4') body += renderSinglesHoleCard(matchId, activePairingId);
  else body += renderBetterBallHoleCard(matchId, activePairingId);

  return header + body;
}

function allPlayersFlat(){ return [...STATE.roster.red, ...STATE.roster.blue]; }

function playerOptionsHtml(selectedId, excludeId){
  return allPlayersFlat().filter(p=>p.id!==excludeId).map(p =>
    `<option value="${p.id}" ${p.id===selectedId?'selected':''}>${escapeHtml(displayName(p))} — ${escapeHtml(p.name)}</option>`
  ).join('');
}

function renderWagerProposeForm(){
  const d = STATE.ui.wagerDraft;
  const matchOptions = Object.keys(MATCH_META).filter(mid => (STATE.lineups[mid]||[]).length>0);
  const selectCls = "w-full bg-[#0e1712] border border-[#24352a] rounded-lg px-2.5 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-[#3fae6a]";

  const kindTabs = ['match','prop'].map(k => `
    <button data-action="wager-kind-select" data-kind="${k}" class="flex-1 text-xs font-semibold py-2 rounded-lg border transition ${d.kind===k?'bg-[#3fae6a] text-[#0a100c] border-[#3fae6a]':'bg-[#111c15] text-[#9db3a4] border-[#243527]'}">${k==='match'?'Match Wager':'Prop Bet'}</button>
  `).join('');

  let fields = '';
  if(d.kind==='match'){
    const pairs = d.matchId ? (STATE.lineups[d.matchId]||[]) : [];
    const segOptions = ['front9','back9','overall'].map(key => ({ key, label: d.matchId ? segLabel(d.matchId, key) : key }));
    fields = `
    <div class="space-y-2 mt-2">
      <select data-action="wager-draft-select" data-field="matchId" class="${selectCls}">
        <option value="">Choose match…</option>
        ${matchOptions.map(mid=>`<option value="${mid}" ${d.matchId===mid?'selected':''}>${MATCH_META[mid].label}</option>`).join('')}
      </select>
      ${d.matchId ? `
      <select data-action="wager-draft-select" data-field="pairingId" class="${selectCls}">
        <option value="">Choose pairing…</option>
        ${pairs.map(p=>`<option value="${p.id}" ${d.pairingId===p.id?'selected':''}>${escapeHtml(pairingLabel(d.matchId,p))}</option>`).join('')}
      </select>` : ''}
      ${d.matchId && d.pairingId ? `
      <select data-action="wager-draft-select" data-field="segment" class="${selectCls}">
        <option value="">Choose segment…</option>
        ${segOptions.map(s=>`<option value="${s.key}" ${d.segment===s.key?'selected':''}>${s.label}</option>`).join('')}
      </select>` : ''}
      <div class="grid grid-cols-2 gap-2">
        <select data-action="wager-draft-select" data-field="proposerId" class="${selectCls}">
          <option value="">Proposer…</option>
          ${playerOptionsHtml(d.proposerId, d.opponentId)}
        </select>
        <select data-action="wager-draft-select" data-field="opponentId" class="${selectCls}">
          <option value="">Opponent…</option>
          ${playerOptionsHtml(d.opponentId, d.proposerId)}
        </select>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-[11px] text-[#7f9689] flex-shrink-0">Proposer picks:</span>
        <select data-action="wager-draft-select" data-field="side" class="${selectCls}">
          <option value="red" ${d.side==='red'?'selected':''}>${escapeHtml(STATE.teamNames.red)} wins</option>
          <option value="blue" ${d.side==='blue'?'selected':''}>${escapeHtml(STATE.teamNames.blue)} wins</option>
        </select>
      </div>
    </div>`;
  } else {
    const propOptions = [
      { v:'medalist', l:'Low Net Medalist' },
      { v:'birdieKing', l:'Birdie King' },
      { v:'champion', l:'Team Red/Blue Champion' },
      { v:'custom', l:'Custom Prop' },
    ];
    let pickFields = '';
    if(d.propKind==='champion'){
      pickFields = `
      <div class="flex items-center gap-2">
        <span class="text-[11px] text-[#7f9689] flex-shrink-0">Proposer picks:</span>
        <select data-action="wager-draft-select" data-field="proposerPick" class="${selectCls}">
          <option value="red" ${d.proposerPick==='red'?'selected':''}>${escapeHtml(STATE.teamNames.red)}</option>
          <option value="blue" ${d.proposerPick==='blue'?'selected':''}>${escapeHtml(STATE.teamNames.blue)}</option>
        </select>
      </div>`;
    } else if(d.propKind==='medalist' || d.propKind==='birdieKing'){
      pickFields = `
      <div class="grid grid-cols-2 gap-2">
        <select data-action="wager-draft-select" data-field="proposerPick" class="${selectCls}">
          <option value="">Proposer's pick…</option>
          ${playerOptionsHtml(d.proposerPick, '')}
        </select>
        <select data-action="wager-draft-select" data-field="opponentPick" class="${selectCls}">
          <option value="">Opponent's pick…</option>
          ${playerOptionsHtml(d.opponentPick, '')}
        </select>
      </div>`;
    } else if(d.propKind==='custom'){
      pickFields = `<input id="wagerLabelInput" type="text" placeholder="Describe the bet (e.g. 'Ace breaks 80')" class="${selectCls}" />`;
    }
    fields = `
    <div class="space-y-2 mt-2">
      <select data-action="wager-draft-select" data-field="propKind" class="${selectCls}">
        ${propOptions.map(o=>`<option value="${o.v}" ${d.propKind===o.v?'selected':''}>${o.l}</option>`).join('')}
      </select>
      ${pickFields}
      <div class="grid grid-cols-2 gap-2">
        <select data-action="wager-draft-select" data-field="proposerId" class="${selectCls}">
          <option value="">Proposer…</option>
          ${playerOptionsHtml(d.proposerId, d.opponentId)}
        </select>
        <select data-action="wager-draft-select" data-field="opponentId" class="${selectCls}">
          <option value="">Opponent…</option>
          ${playerOptionsHtml(d.opponentId, d.proposerId)}
        </select>
      </div>
    </div>`;
  }

  return `
  <div class="mx-4 mb-4 rounded-xl border border-[#1f2f26] bg-[#0f1913] p-3">
    <div class="flex gap-2">${kindTabs}</div>
    ${fields}
    <div class="flex items-center gap-2 mt-3">
      <span class="text-[11px] text-[#7f9689] flex-shrink-0">Stake $</span>
      <input id="wagerAmountInput" type="number" min="1" step="5" value="10" class="w-20 bg-[#0e1712] border border-[#24352a] rounded-lg px-2 py-2 text-xs text-center focus:outline-none focus:ring-1 focus:ring-[#3fae6a]" />
      <span class="text-[11px] text-[#7f9689] flex-shrink-0">each</span>
      <button data-action="propose-wager" class="ml-auto text-xs font-semibold px-4 py-2 rounded-lg bg-[#3fae6a] text-[#0a100c] active:scale-95 transition">Propose</button>
    </div>
  </div>`;
}

function wagerStatusPill(status){
  const map = {
    OPEN: 'bg-[#3a2f12] border-[#7d6a2f] text-[#f2d17f]',
    ACCEPTED: 'bg-[#132436] border-[#2f5a7d] text-[#8fc4f2]',
    SETTLED: 'bg-[#123a22] border-[#2f7d4f] text-[#7be6a4]',
    PUSHED: 'bg-[#161f1a] border-[#3a3527] text-[#d9c88f]',
    DECLINED: 'bg-[#161f1a] border-[#243527] text-[#7f9689]',
  };
  return `<span class="flex-shrink-0 text-[9px] font-semibold uppercase tracking-wide px-1.5 py-0.5 rounded-full border ${map[status]||map.DECLINED}">${status.toLowerCase()}</span>`;
}

function wagerCardDescription(w){
  if(w.wagerType===WAGER_TYPE.MATCH_SEGMENT){
    const pickTeam = w.targetTeam==='RED' ? STATE.teamNames.red : STATE.teamNames.blue;
    const pair = (STATE.lineups[w.sessionId]||[]).find(p=>p.id===w.matchId);
    const matchupText = pair ? pairingLabel(w.sessionId, pair) : 'Unknown pairing';
    return `${escapeHtml(displayName(playerById(w.creatorId)))} vs ${escapeHtml(displayName(playerById(w.acceptorId)))} · ${MATCH_META[w.sessionId]?.label||w.sessionId} · ${escapeHtml(matchupText)} · ${segLabel(w.sessionId, segFromEnum(w.segment))} — creator picks ${escapeHtml(pickTeam)}`;
  }
  if(w.wagerType===WAGER_TYPE.PRESS){
    const team = w.targetTeam==='RED' ? STATE.teamNames.red : STATE.teamNames.blue;
    const pair = (STATE.lineups[w.sessionId]||[]).find(p=>p.id===w.matchId);
    const matchupText = pair ? pairingLabel(w.sessionId, pair) : '';
    return `Press by ${escapeHtml(team)} · ${MATCH_META[w.sessionId]?.label||w.sessionId} · ${escapeHtml(matchupText)} · ${w.segment}`;
  }
  const kindLabels = { medalist:'Low Net Medalist', birdieKing:'Birdie King', champion:'Tournament Champion', custom:'Custom Prop' };
  if(w.propKind==='custom') return `Custom: ${escapeHtml(w.label||'')} — ${escapeHtml(displayName(playerById(w.creatorId)))} vs ${escapeHtml(displayName(playerById(w.acceptorId)))}`;
  const pickName = (id) => w.propKind==='champion' ? (id==='red'?STATE.teamNames.red:STATE.teamNames.blue) : displayName(playerById(id));
  return `${kindLabels[w.propKind]||'Prop'} — ${escapeHtml(displayName(playerById(w.creatorId)))} picks ${escapeHtml(pickName(w.creatorPick))}, ${escapeHtml(displayName(playerById(w.acceptorId)))} picks ${escapeHtml(pickName(w.acceptorPick))}`;
}

function wagerOutcomeText(w){
  if(w.status!==WAGER_STATUS.SETTLED && w.status!==WAGER_STATUS.PUSHED) return '';
  if(w.status===WAGER_STATUS.PUSHED) return `Push — stakes returned, no money moved.`;
  if(w.wagerType===WAGER_TYPE.PRESS){
    const teamName = w.targetTeam==='RED' ? STATE.teamNames.red : STATE.teamNames.blue;
    return `${escapeHtml(teamName)} won the press.`;
  }
  return `${escapeHtml(displayName(playerById(w.winnerId)))} won ${fmtMoney(w.amount)}.`;
}

function renderWagerCard(w){
  const isPending = w.status===WAGER_STATUS.OPEN;
  const canManuallySettle = w.wagerType===WAGER_TYPE.PROP && w.status===WAGER_STATUS.ACCEPTED && adminAuthenticated;
  return `
  <div class="mx-4 mb-2 rounded-xl border border-[#1f2f26] bg-[#0f1913] p-3">
    <div class="flex items-start justify-between gap-2">
      <div class="text-xs text-[#eef3ee] font-medium">${wagerCardDescription(w)}</div>
      ${wagerStatusPill(w.status)}
    </div>
    <div class="text-[11px] text-[#d9b25c] font-display font-600 mt-1">${fmtMoney(w.amount)} stake</div>
    ${(w.status===WAGER_STATUS.SETTLED || w.status===WAGER_STATUS.PUSHED) ? `<div class="text-[11px] text-[#7be6a4] mt-1">${wagerOutcomeText(w)}</div>` : ''}
    ${isPending ? `
    <div class="flex gap-2 mt-2">
      <button data-action="accept-wager" data-wager="${w.wagerId}" class="flex-1 text-[11px] font-semibold py-1.5 rounded-lg bg-[#3fae6a] text-[#0a100c] active:scale-95 transition">✓ Accept</button>
      <button data-action="decline-wager" data-wager="${w.wagerId}" class="flex-1 text-[11px] font-semibold py-1.5 rounded-lg bg-[#2a1418] border border-[#7d2f3a] text-[#f2a1ab] active:scale-95 transition">✗ Decline</button>
    </div>` : ''}
    ${canManuallySettle ? `
    <div class="flex gap-2 mt-2">
      <button data-action="settle-prop" data-wager="${w.wagerId}" data-winner="creator" class="flex-1 text-[11px] font-semibold py-1.5 rounded-lg bg-[#16241b] border border-[#243527] text-[#c9d8cd] active:scale-95 transition">${escapeHtml(displayName(playerById(w.creatorId)))} won</button>
      <button data-action="settle-prop" data-wager="${w.wagerId}" data-winner="acceptor" class="flex-1 text-[11px] font-semibold py-1.5 rounded-lg bg-[#16241b] border border-[#243527] text-[#c9d8cd] active:scale-95 transition">${escapeHtml(displayName(playerById(w.acceptorId)))} won</button>
      <button data-action="settle-prop" data-wager="${w.wagerId}" data-winner="push" class="text-[11px] font-semibold px-3 py-1.5 rounded-lg bg-[#16241b] border border-[#243527] text-[#c9d8cd] active:scale-95 transition">Push</button>
    </div>` : ''}
  </div>`;
}

function renderWagerCentralTab(){
  const pending = STATE.wagers.filter(w=>w.status===WAGER_STATUS.OPEN);
  const active = STATE.wagers.filter(w=>w.status===WAGER_STATUS.ACCEPTED);
  const settled = STATE.wagers.filter(w=>w.status===WAGER_STATUS.SETTLED || w.status===WAGER_STATUS.PUSHED || w.status===WAGER_STATUS.DECLINED).slice().reverse();

  return `
  <div class="px-4 pt-4 pb-2">
    <h2 class="font-display font-700 text-lg">🎲 Wager Central</h2>
    <p class="text-xs text-[#7f9689]">Propose a $ side bet, accept or decline what's on the table, and watch it settle automatically as matches finish. Every dollar flows through the Settlement tab at the end.</p>
  </div>
  ${renderWagerProposeForm()}
  ${pending.length ? `<h3 class="mx-4 font-display font-600 text-sm text-[#f2d17f] mb-2">⏳ Awaiting Response (${pending.length})</h3>${pending.map(renderWagerCard).join('')}` : ''}
  ${active.length ? `<h3 class="mx-4 mt-4 font-display font-600 text-sm text-[#8fc4f2] mb-2">🔥 Active (${active.length})</h3>${active.map(renderWagerCard).join('')}` : ''}
  ${(!pending.length && !active.length) ? `<p class="mx-4 text-sm text-[#7f9689] mb-4">No open wagers. Propose one above.</p>` : ''}
  <details class="mx-4 mt-4 mb-8">
    <summary class="cursor-pointer text-xs text-[#9db3a4] font-medium">Settled &amp; Declined (${settled.length}) ▾</summary>
    <div class="mt-2">${settled.length ? settled.map(renderWagerCard).join('') : `<p class="text-[11px] text-[#66786b] py-2">Nothing settled yet.</p>`}</div>
  </details>`;
}

/* =========================================================

   ========================================================= */
function payoutLinkButtons(fromPlayer, toPlayer, amount){
  const note = `Turtle Cup settlement`;
  const venmoApp = venmoDeepLink(toPlayer.venmo, amount, note);
  const venmoWeb = venmoWebLink(toPlayer.venmo);
  const zelleText = toPlayer.zelle ? `Zelle ${toPlayer.zelle}` : 'No Zelle on file';
  return `
  <div class="flex flex-wrap gap-2 mt-2">
    <a href="${venmoApp}" class="text-[11px] font-semibold px-3 py-1.5 rounded-lg bg-[#0074DE] text-white active:scale-95 transition">Open Venmo</a>
    <a href="${venmoWeb}" target="_blank" rel="noopener" class="text-[11px] font-semibold px-3 py-1.5 rounded-lg bg-[#16241b] border border-[#243527] text-[#c9d8cd] active:scale-95 transition">Venmo profile</a>
    <button data-action="copy-settlement" data-text="${escapeAttr(`${fmtMoney(amount)} to ${toPlayer.zelle||toPlayer.name} via Zelle`)}" class="text-[11px] font-semibold px-3 py-1.5 rounded-lg bg-[#16241b] border border-[#243527] text-[#c9d8cd] active:scale-95 transition">${escapeHtml(zelleText)} — Copy</button>
  </div>`;
}

function renderSettlementTab(){
  const { rows, purse } = computeFinalNetBalances();
  const txns = computeSettlementTransactions(rows);
  const rankedRows = rows.slice().sort((a,b)=>b.finalNet-a.finalNet);
  const allMatchesDone = Object.keys(MATCH_META).every(mid => allPairingIds(mid).every(pid => {
    const evalr = evaluateMatch(mid, pid);
    return evalr && evalr.segments[2].final.finished;
  }) || allPairingIds(mid).length===0);

  const purseRows = [
    { label:'Winning Team Pool', amt: purse.winningPool, note: purse.winningSide ? `→ ${purse.winningSide==='red'?STATE.teamNames.red:STATE.teamNames.blue}` : '→ tied, split evenly' },
    { label:'Low Net Medalist Pool', amt: purse.medalistPool, note: purse.medalistId ? `→ ${escapeHtml(displayName(playerById(purse.medalistId)))}` : '→ no medalist yet, split evenly' },
    { label:'Trophy (Birdie King) Pool', amt: purse.trophyPool, note: purse.birdieKingId ? `→ ${escapeHtml(displayName(playerById(purse.birdieKingId)))}` : '→ no birdie king yet, split evenly' },
  ];

  const balanceRows = rankedRows.map(r => {
    const color = r.finalNet>0.005 ? 'text-[#7be6a4]' : r.finalNet<-0.005 ? 'text-[#f2a1ab]' : 'text-[#7f9689]';
    return `
    <div class="mx-4 mb-2 rounded-xl border border-[#1f2f26] bg-[#0f1913] px-3 py-2.5">
      <div class="flex items-center justify-between">
        <div class="font-display font-600 text-sm">${escapeHtml(displayName(r.player))}</div>
        <div class="font-display font-700 text-base ${color}">${fmtMoney(r.finalNet)}</div>
      </div>
      <div class="text-[10px] text-[#7f9689] mt-1">Buy-in ${fmtMoney(-r.buyIn)} · Purse ${fmtMoney(r.purseShare)} · Wagers ${fmtMoney(r.wagerNet)}</div>
    </div>`;
  }).join('');

  const txnCards = txns.map(t => {
    const toPlayer = playerById(t.toId);
    return `
    <div class="mx-4 mb-3 rounded-xl border border-[#7d6a2f] bg-[#201a0c] p-3">
      <div class="text-sm text-[#f5efe0]"><b>${escapeHtml(t.fromName)}</b> owes <b>${escapeHtml(t.toName)}</b> <span class="font-display font-700 text-[#d9b25c]">${fmtMoney(t.amount)}</span></div>
      ${payoutLinkButtons(playerById(t.fromId), toPlayer, t.amount)}
    </div>`;
  }).join('');

  return `
  <div class="px-4 pt-4 pb-2">
    <h2 class="font-display font-700 text-lg">🤝 Settlement</h2>
    <p class="text-xs text-[#7f9689]">${allMatchesDone ? 'All matches complete — this is final.' : 'Live projection — updates as scores and wagers come in. Not final until every match is complete.'} Final Net = Purse Share − Buy-In + Wager Net.</p>
  </div>

  <div class="mx-4 mb-4 rounded-xl border border-[#1f2f26] bg-[#0f1913] p-3">
    <div class="text-[10px] uppercase tracking-wide text-[#9db3a4] font-semibold mb-2">Purse Breakdown — Total ${fmtMoney(purse.totalPurse)}</div>
    ${purseRows.map(pr=>`
