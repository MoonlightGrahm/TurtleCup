<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Turtle Cup — Ryder Cup Format</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  html,body{ background:#0a100c; }

    background-image: radial-gradient(circle at 1px 1px, rgba(217,178,92,0.14) 1px, transparent 1px);

  }

<body class="min-h-screen bg-[#0a100c] text-[#eef3ee] antialiased">
<div id="root" class="max-w-xl mx-auto min-h-screen flex flex-col"></div>

<script>
/* =========================================================
   TURTLE CUP — RYDER CUP FORMAT — DATA MODEL
   ========================================================= */
const RED = '#fb6a6a';
const BLUE = '#5aa9f2';

// Terrapin Ridge Golf Club — Par 72, Stroke Index 1-18
const PARS = [4,5,3,4,4,3,5,4,4, 4,4,3,5,4,4,3,5,4];
const SIS  = [5,1,17,9,3,15,7,13,11, 2,16,4,10,18,6,12,8,14];

const MATCH_META = {
  m1: { id:'m1', label:'Match 1', sub:'Friday · 18 Holes · Better Ball', format:'betterball' },
  m2: { id:'m2', label:'Match 2', sub:'Saturday AM · 18 Holes · Better Ball', format:'betterball' },
  m3: { id:'m3', label:'Match 3', sub:'Saturday PM · 9 Holes · Pinehurst', format:'pinehurst' },
  m4: { id:'m4', label:'Match 4', sub:'Sunday · Singles Match Play', format:'singles' },
};

const LS_KEY = 'turtleCupRyderState_v1';
const ADMIN_PASSCODE = '1234';
let lastSavedAt = null;
let nextPlayerNum = 1;
let nextPairNum = 1;

function baselineRoster(){
  return {
    red: [
      { id:'p1', name:'Alex Morgan', hcp:9 },
      { id:'p2', name:'Jamie Lee', hcp:13 },
      { id:'p3', name:'Chris Park', hcp:6 },
      { id:'p4', name:'Sam Rivera', hcp:16 },
    ],
    blue: [
      { id:'p5', name:'Jordan Blake', hcp:11 },
      { id:'p6', name:'Taylor Kim', hcp:18 },
      { id:'p7', name:'Casey Nguyen', hcp:8 },
      { id:'p8', name:'Morgan Diaz', hcp:21 },
    ],
  };
}

// Captains set independent pairings per match — default mock data shows different combos each round
function baselineLineups(){
  return {
    m1: [
      { id:'pair1', red:['p1','p2'], blue:['p5','p6'] },
      { id:'pair2', red:['p3','p4'], blue:['p7','p8'] },
    ],
    m2: [
      { id:'pair3', red:['p1','p3'], blue:['p5','p7'] },
      { id:'pair4', red:['p2','p4'], blue:['p6','p8'] },
    ],
    m3: [
      { id:'pair5', red:['p1','p4'], blue:['p5','p8'] },
      { id:'pair6', red:['p2','p3'], blue:['p6','p7'] },
    ],
    m4: [
      { id:'pair7', red:'p1', blue:'p5' },
      { id:'pair8', red:'p2', blue:'p6' },
      { id:'pair9', red:'p3', blue:'p7' },
      { id:'pair10', red:'p4', blue:'p8' },
    ],
  };
}

function emptyHoles(matchId){
  const count = matchId==='m3' ? 9 : 18;
  if(matchId==='m1' || matchId==='m2'){
    return Array.from({length:count}, () => ({ a1:'', a2:'', b1:'', b2:'' }));
  }
  return Array.from({length:count}, () => ({ a:'', b:'' }));
}

function buildScoresForLineups(lineups){
  const scores = {};
  Object.keys(MATCH_META).forEach(mid => {
    scores[mid] = {};
    (lineups[mid] || []).forEach(pair => {
      scores[mid][pair.id] = { holes: emptyHoles(mid) };
    });
  });
  return scores;
}

function defaultState(){
  const lineups = baselineLineups();
  return {
    ui: { tab:'m1', pairing:{ m1:0, m2:0, m3:0, m4:0 }, draft:{ m1:{r1:'',r2:'',b1:'',b2:''}, m2:{r1:'',r2:'',b1:'',b2:''}, m3:{r1:'',r2:'',b1:'',b2:''}, m4:{r:'',b:''} } },
    admin: { enabled:false },
    teamNames: { red:'Team Red', blue:'Team Blue' },
    roster: baselineRoster(),
    lineups,
    scores: buildScoresForLineups(lineups),
  };
}

let STATE = defaultState();

/* =========================================================
   PERSISTENCE (offline cache / localStorage sync)
   ========================================================= */
function recalcCounters(){
  let maxP=0, maxPair=0;
  [...STATE.roster.red, ...STATE.roster.blue].forEach(p=>{
    const n = parseInt(String(p.id).replace(/[^0-9]/g,''),10);
    if(!isNaN(n)) maxP = Math.max(maxP, n);
  });
  Object.values(STATE.lineups).forEach(list => list.forEach(pair => {
    const n = parseInt(String(pair.id).replace(/[^0-9]/g,''),10);
    if(!isNaN(n)) maxPair = Math.max(maxPair, n);
  }));
  nextPlayerNum = maxP+1;
  nextPairNum = maxPair+1;
}

function saveState(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      teamNames: STATE.teamNames, roster: STATE.roster, lineups: STATE.lineups, scores: STATE.scores,
      ui: { tab: STATE.ui.tab, pairing: STATE.ui.pairing }, savedAt: Date.now(),
    }));
    lastSavedAt = Date.now();
  } catch(e){ /* storage unavailable — app still works in-memory */ }
}

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.roster || !parsed.lineups || !parsed.scores) return false;
    STATE.teamNames = parsed.teamNames || STATE.teamNames;
    STATE.roster = parsed.roster;
    STATE.lineups = parsed.lineups;
    STATE.scores = parsed.scores;
    if(parsed.ui){ STATE.ui.tab = parsed.ui.tab || 'm1'; STATE.ui.pairing = parsed.ui.pairing || STATE.ui.pairing; }
    lastSavedAt = parsed.savedAt || Date.now();
    return true;
  } catch(e){ return false; }
}

function formatClock(ts){
  if(!ts) return '';
  return new Date(ts).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}

/* =========================================================
   CORE GOLF LOGIC
   ========================================================= */
function strokesOnHole(hcp, si){
  if(hcp == null || hcp < 0) return 0;
  const base = Math.floor(hcp/18);
  const remainder = hcp - base*18; // 0..17
  return base + (si <= remainder ? 1 : 0);
}

function playerById(id){
  return STATE.roster.red.find(p=>p.id===id) || STATE.roster.blue.find(p=>p.id===id) || { id, name:'Unknown', hcp:0 };
}

function teamHandicapOf(ids){
  const p1 = playerById(ids[0]), p2 = playerById(ids[1]);
  return Math.round((p1.hcp + p2.hcp)/2);
}

function bestOf(x,y){
  if(x==null && y==null) return null;
  if(x==null) return y;
  if(y==null) return x;
  return Math.min(x,y);
}

function holeWinner(a,b){
  if(a==null || b==null) return null;
  if(a<b) return 'a';
  if(b<a) return 'b';
  return 'halved';
}

function holeRange(matchId){
  return matchId === 'm3' ? { start:9, count:9 } : { start:0, count:18 };
}

// Runs match-play logic over an ordered array of 'a'|'b'|'halved'|null hole results (used per segment)
function playMatch(results){
  const total = results.length;
  let diff = 0;
  let clinch = null;
  let enteredCount = 0;
  let stopped = false;

  for(let i=0;i<total;i++){
    const r = results[i];
    if(stopped || r === null){ if(!stopped) stopped = true; continue; }
    enteredCount++;
    if(r==='a') diff++; else if(r==='b') diff--;
    const holesPlayed = i+1;
    const holesRemaining = total - holesPlayed;
    if(clinch===null && Math.abs(diff) > holesRemaining){
      clinch = { diff, holesPlayed, holesRemaining };
    }
  }

  let final;
  if(clinch){
    const winner = clinch.diff>0 ? 'a' : 'b';
    final = {
      finished:true, winner,
      closeout: `${Math.abs(clinch.diff)}&${clinch.holesRemaining}`,
      pointsA: winner==='a'?1:0, pointsB: winner==='b'?1:0,
    };
  } else if(enteredCount===total){
    const winner = diff>0 ? 'a' : (diff<0 ? 'b' : 'halved');
    final = {
      finished:true, winner,
      closeout: winner==='halved' ? 'Halved' : '1UP',
      pointsA: winner==='a'?1:(winner==='halved'?0.5:0),
      pointsB: winner==='b'?1:(winner==='halved'?0.5:0),
    };
  } else {
    final = { finished:false };
  }
  return { final, currentDiff: diff, enteredCount };
}

// Overall running diff (per hole) purely for the status column of the full scorecard
function runningDiffs(results){
  let diff = 0;
  const out = [];
  for(let i=0;i<results.length;i++){
    const r = results[i];
    if(r===null){ out.push(null); continue; }
    if(r==='a') diff++; else if(r==='b') diff--;
    out.push(diff);
  }
  return out;
}

// 3-point segment engine: Front9/Back9/Overall for 18H matches, Holes1-5/6-9/Overall for the 9H Pinehurst match
function computeSegments(matchId, results){
  const defs = matchId==='m3'
    ? [ { label:'Holes 1–5', s:0, e:5 }, { label:'Holes 6–9', s:5, e:9 }, { label:'Overall', s:0, e:9 } ]
    : [ { label:'Front 9', s:0, e:9 }, { label:'Back 9', s:9, e:18 }, { label:'Overall', s:0, e:18 } ];
  return defs.map(d => ({ label:d.label, ...playMatch(results.slice(d.s, d.e)) }));
}

function segmentPointTotals(segments){
  let a=0, b=0;
  segments.forEach(s => { if(s.final.finished){ a += s.final.pointsA; b += s.final.pointsB; } });
  return { a, b };
}

// Builds full per-hole detail + 3-point segments for one pairing's scorecard
function evaluateMatch(matchId, pairingId){
  const pair = (STATE.lineups[matchId] || []).find(p => p.id === pairingId);
  if(!pair) return null;
  const { start, count } = holeRange(matchId);
  const entry = STATE.scores[matchId][pairingId];
  const holesDetail = [];
  const results = [];

  if(matchId==='m1' || matchId==='m2'){
    const rp1 = playerById(pair.red[0]), rp2 = playerById(pair.red[1]);
    const bp1 = playerById(pair.blue[0]), bp2 = playerById(pair.blue[1]);
    for(let i=0;i<count;i++){
      const si = SIS[start+i];
      const h = entry.holes[i];
      const a1 = h.a1===''?null:(h.a1 - strokesOnHole(rp1.hcp, si));
      const a2 = h.a2===''?null:(h.a2 - strokesOnHole(rp2.hcp, si));
      const b1 = h.b1===''?null:(h.b1 - strokesOnHole(bp1.hcp, si));
      const b2 = h.b2===''?null:(h.b2 - strokesOnHole(bp2.hcp, si));
      const aNet = bestOf(a1,a2), bNet = bestOf(b1,b2);
      const w = holeWinner(aNet,bNet);
      results.push(w);
      holesDetail.push({ hole:start+i+1, par:PARS[start+i], si, raw:h, a1,a2,b1,b2, aNet, bNet, winner:w });
    }
    var redPlayers=[rp1,rp2], bluePlayers=[bp1,bp2];
  } else if(matchId==='m3'){
    const hcpRed = teamHandicapOf(pair.red), hcpBlue = teamHandicapOf(pair.blue);
    for(let i=0;i<count;i++){
      const si = SIS[start+i];
      const h = entry.holes[i];
      const aNet = h.a===''?null:(h.a - strokesOnHole(hcpRed, si));
      const bNet = h.b===''?null:(h.b - strokesOnHole(hcpBlue, si));
      const w = holeWinner(aNet,bNet);
      results.push(w);
      holesDetail.push({ hole:start+i+1, par:PARS[start+i], si, raw:h, hcpRed, hcpBlue, aNet, bNet, winner:w });
    }
    var redPlayers=[playerById(pair.red[0]), playerById(pair.red[1])];
    var bluePlayers=[playerById(pair.blue[0]), playerById(pair.blue[1])];
  } else if(matchId==='m4'){
    const rp = playerById(pair.red), bp = playerById(pair.blue);
    for(let i=0;i<count;i++){
      const si = SIS[start+i];
      const h = entry.holes[i];
      const aNet = h.a===''?null:(h.a - strokesOnHole(rp.hcp, si));
      const bNet = h.b===''?null:(h.b - strokesOnHole(bp.hcp, si));
      const w = holeWinner(aNet,bNet);
      results.push(w);
      holesDetail.push({ hole:start+i+1, par:PARS[start+i], si, raw:h, rp, bp, aNet, bNet, winner:w });
    }
    var redPlayers=[rp], bluePlayers=[bp];
  }

  const segments = computeSegments(matchId, results);
  const totals = segmentPointTotals(segments);
  const statusPerHole = runningDiffs(results);

  return { pair, redPlayers, bluePlayers, holesDetail, segments, totals, statusPerHole };
}

function allPairingIds(matchId){
  return (STATE.lineups[matchId] || []).map(p => p.id);
}

function computeStandings(){
  let red=0, blue=0, totalAvailable=0;
  Object.keys(MATCH_META).forEach(mid => {
    allPairingIds(mid).forEach(pid => {
      totalAvailable += 3;
      const evalr = evaluateMatch(mid, pid);
      if(evalr){ red += evalr.totals.a; blue += evalr.totals.b; }
    });
  });
  return { red, blue, totalAvailable, target: totalAvailable/2 };
}

/* =========================================================
   RENDERING — SHARED HELPERS
   ========================================================= */
function initials(name){ return name.split(' ').map(w=>w[0]).join('').toUpperCase(); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function pairingLabel(matchId, pair){
  if(matchId==='m4'){
    return `${initials(playerById(pair.red).name)} vs ${initials(playerById(pair.blue).name)}`;
  }
  const r = pair.red.map(id=>initials(playerById(id).name)).join('/');
  const b = pair.blue.map(id=>initials(playerById(id).name)).join('/');
  return `${r} vs ${b}`;
}

/* =========================================================
   RENDERING — HEADER
   ========================================================= */
function renderHeader(){
  const st = computeStandings();
  const online = navigator.onLine;
  const syncLabel = online ? 'Online · Synced' : 'Offline · Cache Saved';
  const syncDot = online ? 'bg-emerald-400' : 'bg-amber-400';
  const syncText = online ? 'text-emerald-300' : 'text-amber-300';

  const totalForBar = Math.max(st.totalAvailable, 1);
  const redPct = (st.red/totalForBar)*100;
  const bluePct = (st.blue/totalForBar)*100;

  return `
  <div class="shell-pattern border-b border-[#1c2a20] bg-gradient-to-b from-[#0f1a13] to-[#0a100c]">
    <div class="px-4 pt-4 pb-3 flex items-start justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-2xl">🐢</span>
          <h1 class="font-display font-700 text-xl tracking-tight">Turtle Cup</h1>
        </div>
        <p class="text-[11px] text-[#7f9689] mt-0.5">Terrapin Ridge Golf Club · Ryder Cup Format</p>
        <div class="flex items-center gap-1.5 mt-1.5">
          <span class="w-1.5 h-1.5 rounded-full ${syncDot}"></span>
          <span class="text-[10px] font-medium ${syncText}">${syncLabel}</span>
          ${lastSavedAt ? `<span class="text-[10px] text-[#5c6f61]">· ${formatClock(lastSavedAt)}</span>` : ''}
        </div>
      </div>
      <div class="flex gap-1.5 flex-shrink-0">
        <button data-action="demo" title="Fill demo scores" class="text-[11px] px-2.5 py-1.5 rounded-lg bg-[#16241b] border border-[#243527] text-[#c9d8cd] hover:border-[#3fae6a] active:scale-95 transition">🎲 Demo</button>
        <button data-action="reset-scores" title="Clear all scores" class="text-[11px] px-2.5 py-1.5 rounded-lg bg-[#16241b] border border-[#243527] text-[#c9d8cd] hover:border-[#e2696f] active:scale-95 transition">↺ Reset</button>
        <button data-action="toggle-admin" title="Admin Mode" class="text-[11px] px-2.5 py-1.5 rounded-lg border active:scale-95 transition ${STATE.admin.enabled ? 'bg-[#3a2f12] border-[#d9b25c] text-[#f2d17f]' : 'bg-[#16241b] border-[#243527] text-[#c9d8cd] hover:border-[#d9b25c]'}">${STATE.admin.enabled ? '🔓' : '🔒'}</button>
      </div>
    </div>

    <div class="px-4 pb-4">
      <div class="flex items-end justify-between">
        <div class="text-left">
          <div class="text-[11px] font-semibold" style="color:${RED}">${escapeHtml(STATE.teamNames.red)}</div>
          <div class="font-display font-700 text-3xl leading-none" style="color:${RED}">${st.red.toFixed(1)}</div>
        </div>
        <div class="text-center pb-1">
          <div class="text-[9px] uppercase tracking-wider text-[#7f9689]">Target to Win</div>
          <div class="font-display font-600 text-sm text-[#d9b25c]">${st.target.toFixed(1)}</div>
        </div>
        <div class="text-right">
          <div class="text-[11px] font-semibold" style="color:${BLUE}">${escapeHtml(STATE.teamNames.blue)}</div>
          <div class="font-display font-700 text-3xl leading-none" style="color:${BLUE}">${st.blue.toFixed(1)}</div>
        </div>
      </div>
      <div class="flex h-2 rounded-full overflow-hidden bg-[#161f1a] mt-2 border border-[#243527]">
        <div style="width:${redPct}%; background:${RED}"></div>
        <div class="flex-1"></div>
        <div style="width:${bluePct}%; background:${BLUE}"></div>
      </div>
      <div class="text-[10px] text-[#5c6f61] mt-1 text-center">${st.totalAvailable.toFixed(1)} points scheduled across ${Object.keys(MATCH_META).reduce((n,m)=>n+allPairingIds(m).length,0)} matchups</div>
    </div>

    ${STATE.admin.enabled ? renderAdminMaintenancePanel() : ''}
  </div>`;
}

function renderAdminMaintenancePanel(){
  return `
  <div class="mx-4 mb-4 rounded-xl border border-[#7d6a2f] bg-[#201a0c] p-3 fade-in">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-semibold text-[#f2d17f]">🛠️ Admin &amp; Maintenance</span>
      <span class="text-[10px] text-[#c9a54e]">Score override active on all cards</span>
    </div>
    <div class="flex flex-wrap gap-2">
      <button data-action="export-data" class="text-[11px] px-2.5 py-1.5 rounded-lg bg-[#16241b] border border-[#243527] text-[#c9d8cd] hover:border-[#3fae6a] active:scale-95 transition">⬇ Export Tournament Data</button>
      <label class="text-[11px] px-2.5 py-1.5 rounded-lg bg-[#16241b] border border-[#243527] text-[#c9d8cd] hover:border-[#3fae6a] active:scale-95 transition cursor-pointer">
        ⬆ Import Tournament Data
        <input type="file" accept="application/json" data-action="import-data" class="hidden" />
      </label>
      <button data-action="hard-reset" class="text-[11px] px-2.5 py-1.5 rounded-lg bg-[#2a1418] border border-[#7d2f3a] text-[#f2a1ab] hover:border-[#e2696f] active:scale-95 transition">⚠ Reset Tournament</button>
    </div>
  </div>`;
}

/* =========================================================
   RENDERING — NAV
   ========================================================= */
function renderNav(){
  const tabs = [
    ...Object.values(MATCH_META).map(m=>({ id:m.id, label:m.label.replace('Match ','M') })),
    { id:'admin', label:'Admin' },
  ];
  return `
  <div class="sticky top-0 z-20 bg-[#0a100c]/95 backdrop-blur border-b border-[#1c2a20] px-3 py-2">
    <div class="grid grid-cols-5 gap-1.5">
      ${tabs.map(t => `
        <button data-tab="${t.id}" class="text-xs font-semibold py-2 rounded-lg transition ${STATE.ui.tab===t.id ? 'tab-active' : 'tab-inactive bg-[#111c15] border border-[#1f2f26] hover:border-[#3fae6a]'}">${t.label}</button>
      `).join('')}
    </div>
  </div>`;
}

function pillRow(items, selectedIdx, groupAttr){
  if(items.length<=1) return '';
  return `<div class="px-4 pt-3 flex gap-2 overflow-x-auto">${items.map((label,i)=>`
    <button ${groupAttr}="${i}" class="flex-shrink-0 text-xs font-medium px-3 py-1.5 rounded-full border transition ${i===selectedIdx ? 'bg-[#3fae6a] text-[#0a100c] border-[#3fae6a]' : 'bg-[#111c15] text-[#9db3a4] border-[#243527] hover:border-[#3fae6a]'}">${label}</button>
  `).join('')}</div>`;
}

/* =========================================================
   RENDERING — MATCH SCORECARDS
   ========================================================= */
function segmentBadges(segments){
  const toneClasses = {
    decided: 'bg-[#123a22] border-[#2f7d4f] text-[#7be6a4]',
    halved: 'bg-[#3a2f12] border-[#7d6a2f] text-[#f2d17f]',
    live: 'bg-[#132436] border-[#2f5a7d] text-[#8fc4f2]',
    idle: 'bg-[#161f1a] border-[#243527] text-[#9db3a4]',
  };
  const cells = segments.map(s => {
    const f = s.final;
    let text, tone, pts;
    if(f.finished){
      if(f.winner==='halved'){ text='Halved'; tone='halved'; }
      else { text = `${f.winner==='a'?'RED':'BLUE'} ${f.closeout}`; tone='decided'; }
      pts = `${f.pointsA.toFixed(1)}–${f.pointsB.toFixed(1)}`;
    } else if(s.enteredCount===0){
      text='Not started'; tone='idle'; pts='0.0–0.0';
    } else if(s.currentDiff===0){
      text=`AS thru ${s.enteredCount}`; tone='idle'; pts='0.0–0.0';
    } else {
      text = `${s.currentDiff>0?'RED':'BLUE'} ${Math.abs(s.currentDiff)}up`; tone='live'; pts='0.0–0.0';
    }
    return `<div class="rounded-lg border px-2 py-2 text-center ${toneClasses[tone]}">
      <div class="text-[9px] uppercase tracking-wide opacity-70">${s.label}</div>
      <div class="text-[11px] font-display font-600 mt-0.5">${text}</div>
      <div class="text-[10px] mt-0.5 opacity-80">${pts} pts</div>
    </div>`;
  }).join('');
  return `<div class="mx-4 mt-3 grid grid-cols-3 gap-2 fade-in">${cells}</div>`;
}

function inputCell(value, attrs, locked){
  return `<input type="number" inputmode="numeric" min="1" max="15" value="${value}" ${locked ? 'disabled' : ''}
    class="score-input w-9 text-center rounded-md py-1 text-[13px] focus:outline-none focus:ring-2 focus:ring-[#3fae6a] ${locked ? 'bg-[#0c130f] border border-[#1c2a20] text-[#5c6f61] cursor-not-allowed' : 'bg-[#0e1712] border border-[#24352a] text-[#eef3ee]'}"
    ${attrs} />`;
}

function statusCellText(diff){
  if(diff==null) return '—';
  if(diff===0) return 'AS';
  return diff>0 ? `${diff}↑` : `${Math.abs(diff)}↓`;
}

function lockNote(locked, finished){
  if(!finished) return '';
  return locked
    ? `<div class="mx-4 mt-2 text-[10px] text-[#7f9689]">🔒 Overall match decided — scorecard locked. Enable Admin Mode to override.</div>`
    : `<div class="mx-4 mt-2 text-[10px] text-[#f2d17f]">✏️ Admin Override active — this scorecard is editable even though the match is final.</div>`;
}

function renderMatchTab(matchId){

  let header = `

    <p class="text-xs text-[#7f9689]">${meta.sub}</p>
  </div>`;

  if(pairs.length===0){
    return header + `<p class="mx-4 mt-4 text-sm text-[#7f9689]">No pairings set for this match yet. Go to the <b>Admin</b> tab to build the lineup.</p>`;
  }

  const pairIdx = Math.min(STATE.ui.pairing[matchId] || 0, pairs.length-1);
  const activePairingId = pairs[pairIdx].id;

  let body = pillRow(pairs.map(p=>pairingLabel(matchId,p)), pairIdx, `data-pairing-select-${matchId}`);

  if(matchId==='m3') body += renderPinehurstTable(matchId, activePairingId);
  else if(matchId==='m4') body += renderSinglesTable(matchId, activePairingId);
  else body += renderBetterBallTable(matchId, activePairingId);

  return header + body;
}

/* =========================================================
   ADMIN: BACKUP / RECOVERY
   ========================================================= */
function exportData(){
  const payload = {
    app: 'turtle-cup-ryder', version: 1, exportedAt: new Date().toISOString(),
    teamNames: STATE.teamNames, roster: STATE.roster, lineups: STATE.lineups, scores: STATE.scores,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `turtle-cup-ryder-backup-${Date.now()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* =========================================================
   DEMO DATA GENERATOR
   ========================================================= */
function randScore(par){
  const wobble = [-1,-1,0,0,0,0,1,1,1,2];
  return Math.max(2, par + wobble[Math.floor(Math.random()*wobble.length)]);
}

function fillDemoScores(){
  Object.keys(MATCH_META).forEach(mid => {
    (STATE.lineups[mid] || []).forEach(pair => {
      const entry = STATE.scores[mid][pair.id];
      const count = mid==='m3' ? 9 : 18;
      const start = mid==='m3' ? 9 : 0;
      for(let i=0;i<count;i++){
        const par = PARS[start+i];
        if(mid==='m1' || mid==='m2'){
          entry.holes[i] = { a1:randScore(par), a2:randScore(par), b1:randScore(par), b2:randScore(par) };
        } else {
          entry.holes[i] = { a:randScore(par), b:randScore(par) };
        }
      }
    });
  });
}

/* =========================================================
   EVENT HANDLING
   ========================================================= */
const root = document.getElementById('root');

root.addEventListener('click', (e) => {
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ STATE.ui.tab = tabBtn.dataset.tab; renderApp(); return; }

  for(const mid of Object.keys(MATCH_META)){
    const pBtn = e.target.closest(`[data-pairing-select-${mid}]`);
    if(pBtn){ STATE.ui.pairing[mid] = parseInt(pBtn.getAttribute(`data-pairing-select-${mid}`),10); renderApp(); return; }
  }

  const action = e.target.closest('[data-action]');
  if(!action) return;
  const act = action.dataset.action;

  if(act==='demo'){
    fillDemoScores();
    renderApp();

  } else if(act==='reset-scores'){
    STATE.scores = buildScoresForLineups(STATE.lineups);
    renderApp();

  } else if(act==='toggle-admin'){
    if(STATE.admin.enabled){
      STATE.admin.enabled = false;
      renderApp();
    } else {
      const pass = prompt('Enter admin passcode to unlock Admin Mode:');
      if(pass===null) return;
      if(pass===ADMIN_PASSCODE){ STATE.admin.enabled = true; renderApp(); }
      else alert('Incorrect passcode.');
    }

  } else if(act==='export-data'){
    exportData();

  } else if(act==='hard-reset'){
    if(confirm('This permanently erases all rosters, lineups and scores and restores baseline mock data. Continue?')){
      localStorage.removeItem(LS_KEY);
      STATE = defaultState();
      recalcCounters();
      renderApp();
    }

  } else if(act==='add-player'){
    const side = action.dataset.side;
    const total = STATE.roster.red.length + STATE.roster.blue.length;
    if(total>=20) return;
    const id = 'p'+nextPlayerNum; nextPlayerNum++;
    STATE.roster[side].push({ id, name:'New Player', hcp:15 });
    renderApp();

  } else if(act==='remove-player'){
    const side = action.dataset.side, pid = action.dataset.player;
    const total = STATE.roster.red.length + STATE.roster.blue.length;
    if(total<=8) return;
    STATE.roster[side] = STATE.roster[side].filter(p=>p.id!==pid);
    // strip this player from any lineup pairings and their scores
    Object.keys(MATCH_META).forEach(mid => {
      STATE.lineups[mid] = (STATE.lineups[mid]||[]).filter(pair => {
        const involved = mid==='m4' ? [pair.red,pair.blue] : [...pair.red, ...pair.blue];
        const hit = involved.includes(pid);
        if(hit) delete STATE.scores[mid][pair.id];
        return !hit;
      });
    });
    renderApp();

  } else if(act==='add-pairing'){
    const mid = action.dataset.match;
    const draft = STATE.ui.draft[mid];
    const id = 'pair'+nextPairNum;
    let pair;
    if(mid==='m4'){
      if(!draft.r || !draft.b) { alert('Choose one Red and one Blue player.'); return; }
      pair = { id, red:draft.r, blue:draft.b };
      STATE.ui.draft[mid] = { r:'', b:'' };
    } else {
      if(!draft.r1 || !draft.r2 || !draft.b1 || !draft.b2){ alert('Choose two Red players and two Blue players.'); return; }
      pair = { id, red:[draft.r1,draft.r2], blue:[draft.b1,draft.b2] };
      STATE.ui.draft[mid] = { r1:'', r2:'', b1:'', b2:'' };
    }
    nextPairNum++;
    STATE.lineups[mid].push(pair);
    STATE.scores[mid][id] = { holes: emptyHoles(mid) };
    renderApp();

  } else if(act==='remove-pairing'){
    const mid = action.dataset.match, pid = action.dataset.pairing;
    if(!confirm('Remove this pairing and its scorecard?')) return;
    STATE.lineups[mid] = STATE.lineups[mid].filter(p=>p.id!==pid);
    delete STATE.scores[mid][pid];
    renderApp();
  }
});

root.addEventListener('change', (e) => {
  if(e.target.matches('.score-input')){
    const el = e.target;
    if(el.disabled) return; // locked scorecard — admin mode required to override
    const matchId = el.dataset.match;
    const pairing = el.dataset.pairing;
    const hole = parseInt(el.dataset.hole,10);
    const role = el.dataset.role;
    const val = el.value === '' ? '' : Math.max(1, Math.min(15, parseInt(el.value,10) || 1));
    STATE.scores[matchId][pairing].holes[hole][role] = val;
    renderApp();

  } else if(e.target.matches('.team-field')){
    const el = e.target;
    const field = el.dataset.field;
    if(field==='team-name'){
      STATE.teamNames[el.dataset.side] = el.value || STATE.teamNames[el.dataset.side];
    } else if(field==='pname'){
      const p = STATE.roster[el.dataset.side].find(pl=>pl.id===el.dataset.player);
      if(p) p.name = el.value || 'Player';
    } else if(field==='phcp'){
      const p = STATE.roster[el.dataset.side].find(pl=>pl.id===el.dataset.player);
      if(p) p.hcp = Math.max(0, parseInt(el.value,10) || 0);
    }
    renderApp();

  } else if(e.target.matches('[data-action="draft-select"]')){
    const mid = e.target.dataset.match, field = e.target.dataset.field;
    STATE.ui.draft[mid][field] = e.target.value;
    renderApp();

  } else if(e.target.matches('[data-action="import-data"]')){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || !parsed.roster || !parsed.lineups || !parsed.scores) throw new Error('Invalid shape');
        STATE.teamNames = parsed.teamNames || STATE.teamNames;
        STATE.roster = parsed.roster;
        STATE.lineups = parsed.lineups;
        STATE.scores = parsed.scores;
        recalcCounters();
        renderApp();
        alert('Tournament data imported successfully.');
      } catch(err){
        alert('Import failed: that file is not valid Turtle Cup tournament data.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }
});

// Enter key moves focus to next score input for fast entry
root.addEventListener('keydown', (e) => {
  if(e.key==='Enter' && e.target.matches('.score-input')){
    e.preventDefault();
    const inputs = Array.from(document.querySelectorAll('.score-input'));
    const i = inputs.indexOf(e.target);
    e.target.dispatchEvent(new Event('change', {bubbles:true}));
    if(i>=0 && i<inputs.length-1) inputs[i+1].focus();
    else e.target.blur();
  }
});

/* =========================================================
   BOOT
   ========================================================= */
if(!loadState()){
  STATE = defaultState();
}
recalcCounters();
renderApp();

window.addEventListener('online', renderApp);
window.addEventListener('offline', renderApp);
</script>
</body>
