<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Turtle Cup — Live Match Play</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{ background:#0a100c; }
  body{ font-family:'Inter',sans-serif; }
  .font-display{ font-family:'Space Grotesk',sans-serif; }
  ::-webkit-scrollbar{ height:6px; width:6px; }
  ::-webkit-scrollbar-thumb{ background:#2a3a30; border-radius:4px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; }
  .shell-pattern{
    background-image: radial-gradient(circle at 1px 1px, rgba(217,178,92,0.14) 1px, transparent 1px);
    background-size: 16px 16px;
  }
  .tab-active{ color:#0a100c; background:#3fae6a; }
  .tab-inactive{ color:#8fa396; }
  .sticky-col{ position:sticky; left:0; background:#101a14; z-index:1; }
  th.sticky-col{ background:#16221a; z-index:2; }
  .score-input:focus{ background:#16241b; }
  .fade-in{ animation: fadein .18s ease-out; }
  @keyframes fadein{ from{opacity:0; transform:translateY(2px);} to{opacity:1; transform:translateY(0);} }
</style>
</head>
<body class="min-h-screen bg-[#0a100c] text-[#eef3ee] antialiased">
<div id="root" class="max-w-xl mx-auto min-h-screen flex flex-col"></div>

<script>
/* =========================================================
   TURTLE CUP — DATA MODEL
   ========================================================= */
const COLORS = ['#2dd4bf','#f2b134','#60a5fa','#fb7185','#a78bfa','#a3e635','#fb923c','#f472b6'];

// Terrapin Ridge Golf Club — Par 72, Stroke Index 1-18
const PARS = [4,5,3,4,4,3,5,4,4, 4,4,3,5,4,4,3,5,4];
const SIS  = [5,1,17,9,3,15,7,13,11, 2,16,4,10,18,6,12,8,14];

const MATCH_META = {
  m1: { id:'m1', label:'Match 1', sub:'Friday · 18 Holes · Better Ball', format:'betterball' },
  m2: { id:'m2', label:'Match 2', sub:'Saturday AM · 18 Holes · Better Ball', format:'betterball' },
  m3: { id:'m3', label:'Match 3', sub:'Saturday PM · 9 Holes · Pinehurst', format:'pinehurst' },
  m4: { id:'m4', label:'Match 4', sub:'Sunday · Singles Best Ball', format:'singles' },
};

const BASELINE_TEAMS = [
  { id:'t1', name:'Shell Shockers', players:[ {id:'p1', name:'Alex Morgan', hcp:9}, {id:'p2', name:'Jamie Lee', hcp:13} ] },
  { id:'t2', name:'Snapping Turtles', players:[ {id:'p3', name:'Chris Park', hcp:6}, {id:'p4', name:'Sam Rivera', hcp:16} ] },
  { id:'t3', name:'Sea Turtles', players:[ {id:'p5', name:'Jordan Blake', hcp:11}, {id:'p6', name:'Taylor Kim', hcp:18} ] },
  { id:'t4', name:'Box Turtles', players:[ {id:'p7', name:'Casey Nguyen', hcp:8}, {id:'p8', name:'Morgan Diaz', hcp:21} ] },
];
function defaultTeams(){ return JSON.parse(JSON.stringify(BASELINE_TEAMS)); }

const LS_KEY = 'turtleCupState_v1';
const ADMIN_PASSCODE = '1234';
let lastSavedAt = null;

let STATE = {
  ui: { tab:'m1', pairing:{ m1:0, m2:0, m3:0, m4:0 }, single:{} },
  admin: { enabled:false },
  teams: defaultTeams(),
  pairs: [],
  scores: {},
};

let nextTeamNum = 5;
let nextPlayerNum = 9;

/* =========================================================
   PERSISTENCE (offline cache / localStorage sync)
   ========================================================= */
function recalcCounters(){
  let maxT=0, maxP=0;
  STATE.teams.forEach(t=>{
    const tn = parseInt(String(t.id).replace(/[^0-9]/g,''),10);
    if(!isNaN(tn)) maxT = Math.max(maxT, tn);
    t.players.forEach(p=>{
      const pn = parseInt(String(p.id).replace(/[^0-9]/g,''),10);
      if(!isNaN(pn)) maxP = Math.max(maxP, pn);
    });
  });
  nextTeamNum = maxT+1;
  nextPlayerNum = maxP+1;
}

function saveState(){
  try{
    const payload = { teams: STATE.teams, pairs: STATE.pairs, scores: STATE.scores, ui: STATE.ui, savedAt: Date.now() };
    localStorage.setItem(LS_KEY, JSON.stringify(payload));
    lastSavedAt = Date.now();
  } catch(e){ /* storage unavailable — fail silently, app still works in-memory */ }
}

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.teams) || !parsed.scores) return false;
    STATE.teams = parsed.teams;
    STATE.pairs = parsed.pairs && parsed.pairs.length ? parsed.pairs : pairTeams();
    STATE.scores = parsed.scores;
    STATE.ui = parsed.ui || STATE.ui;
    lastSavedAt = parsed.savedAt || Date.now();
    return true;
  } catch(e){ return false; }
}

function formatClock(ts){
  if(!ts) return '';
  return new Date(ts).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}

/* =========================================================
   CORE GOLF LOGIC
   ========================================================= */
function pairTeams(){
  const pairs = [];
  for(let i=0;i<STATE.teams.length;i+=2){
    pairs.push({ a:i, b:(i+1<STATE.teams.length)? i+1 : null });
  }
  return pairs;
}

function buildScores(){
  const pairs = pairTeams();
  STATE.pairs = pairs;
  const scores = {};
  scores.m1 = pairs.map(p => p.b===null ? null : { holes: Array.from({length:18},()=>({a1:'',a2:'',b1:'',b2:''})) });
  scores.m2 = pairs.map(p => p.b===null ? null : { holes: Array.from({length:18},()=>({a1:'',a2:'',b1:'',b2:''})) });
  scores.m3 = pairs.map(p => p.b===null ? null : { holes: Array.from({length:9},()=>({a:'',b:''})) });
  scores.m4 = pairs.map(p => p.b===null ? null : [
    { holes: Array.from({length:18},()=>({a:'',b:''})) },
    { holes: Array.from({length:18},()=>({a:'',b:''})) },
  ]);
  STATE.scores = scores;
  STATE.ui.pairing = { m1:0, m2:0, m3:0, m4:0 };
  STATE.ui.single = {};
}

// Strokes a player/team receives on a given hole based on raw handicap + hole's stroke index (1-18)
function strokesOnHole(hcp, si){
  if(hcp == null || hcp < 0) return 0;
  const base = Math.floor(hcp/18);
  const remainder = hcp - base*18; // 0..17
  return base + (si <= remainder ? 1 : 0);
}

function teamHandicap(team){
  return Math.round((team.players[0].hcp + team.players[1].hcp)/2);
}

function bestOf(x,y){
  if(x==null && y==null) return null;
  if(x==null) return y;
  if(y==null) return x;
  return Math.min(x,y);
}

function holeWinner(a,b){
  if(a==null || b==null) return null;
  if(a<b) return 'a';
  if(b<a) return 'b';
  return 'halved';
}

function holeRange(matchId){
  return matchId === 'm3' ? { start:9, count:9 } : { start:0, count:18 };
}

// Runs match-play logic over an ordered array of 'a'|'b'|'halved'|null hole results
function playMatch(results){
  const total = results.length;
  let diff = 0;
  let clinch = null;
  const statusPerHole = [];
  let enteredCount = 0;
  let stopped = false;

  for(let i=0;i<total;i++){
    const r = results[i];
    if(stopped || r === null){ statusPerHole.push(null); if(!stopped) stopped = true; continue; }
    enteredCount++;
    if(r==='a') diff++; else if(r==='b') diff--;
    statusPerHole.push(diff);
    const holesPlayed = i+1;
    const holesRemaining = total - holesPlayed;
    if(clinch===null && Math.abs(diff) > holesRemaining){
      clinch = { diff, holesPlayed, holesRemaining };
    }
  }

  let final;
  if(clinch){
    const winner = clinch.diff>0 ? 'a' : 'b';
    final = {
      finished:true, winner,
      closeout: `${Math.abs(clinch.diff)}&${clinch.holesRemaining}`,
      pointsA: winner==='a'?1:0, pointsB: winner==='b'?1:0,
    };
  } else if(enteredCount===total){
    const winner = diff>0 ? 'a' : (diff<0 ? 'b' : 'halved');
    final = {
      finished:true, winner,
      closeout: winner==='halved' ? 'Halved' : '1UP',
      pointsA: winner==='a'?1:(winner==='halved'?0.5:0),
      pointsB: winner==='b'?1:(winner==='halved'?0.5:0),
    };
  } else {
    final = { finished:false };
  }
  return { statusPerHole, final, currentDiff: diff, enteredCount };
}

// Builds full per-hole detail (nets, winners) + final match result for a given scorecard
function evaluateMatch(matchId, pairingIdx, sub){
  const pair = STATE.pairs[pairingIdx];
  const teamA = STATE.teams[pair.a];
  const teamB = STATE.teams[pair.b];
  const { start, count } = holeRange(matchId);
  const results = [];
  const holesDetail = [];

  if(matchId==='m1' || matchId==='m2'){
    const entry = STATE.scores[matchId][pairingIdx];
    for(let i=0;i<count;i++){
      const si = SIS[start+i];
      const h = entry.holes[i];
      const a1 = h.a1===''?null:(h.a1 - strokesOnHole(teamA.players[0].hcp, si));
      const a2 = h.a2===''?null:(h.a2 - strokesOnHole(teamA.players[1].hcp, si));
      const b1 = h.b1===''?null:(h.b1 - strokesOnHole(teamB.players[0].hcp, si));
      const b2 = h.b2===''?null:(h.b2 - strokesOnHole(teamB.players[1].hcp, si));
      const aNet = bestOf(a1,a2), bNet = bestOf(b1,b2);
      const w = holeWinner(aNet,bNet);
      results.push(w);
      holesDetail.push({ hole:start+i+1, par:PARS[start+i], si, raw:h, a1,a2,b1,b2, aNet, bNet, winner:w });
    }
  } else if(matchId==='m3'){
    const entry = STATE.scores.m3[pairingIdx];
    const hcpA = teamHandicap(teamA), hcpB = teamHandicap(teamB);
    for(let i=0;i<count;i++){
      const si = SIS[start+i];
      const h = entry.holes[i];
      const aNet = h.a===''?null:(h.a - strokesOnHole(hcpA, si));
      const bNet = h.b===''?null:(h.b - strokesOnHole(hcpB, si));
      const w = holeWinner(aNet,bNet);
      results.push(w);
      holesDetail.push({ hole:start+i+1, par:PARS[start+i], si, raw:h, hcpA, hcpB, aNet, bNet, winner:w });
    }
  } else if(matchId==='m4'){
    const entry = STATE.scores.m4[pairingIdx][sub];
    const pA = teamA.players[sub], pB = teamB.players[sub];
    for(let i=0;i<count;i++){
      const si = SIS[start+i];
      const h = entry.holes[i];
      const aNet = h.a===''?null:(h.a - strokesOnHole(pA.hcp, si));
      const bNet = h.b===''?null:(h.b - strokesOnHole(pB.hcp, si));
      const w = holeWinner(aNet,bNet);
      results.push(w);
      holesDetail.push({ hole:start+i+1, par:PARS[start+i], si, raw:h, pA, pB, aNet, bNet, winner:w });
    }
  }

  const played = playMatch(results);
  return { teamA, teamB, holesDetail, ...played };
}

function computeStandings(){
  const pts = {};
  STATE.teams.forEach(t => pts[t.id] = 0);
  STATE.pairs.forEach((pair, idx) => {
    if(pair.b===null) return;
    const teamA = STATE.teams[pair.a], teamB = STATE.teams[pair.b];
    ['m1','m2','m3'].forEach(mid => {
      const r = evaluateMatch(mid, idx);
      if(r.final.finished){ pts[teamA.id]+=r.final.pointsA; pts[teamB.id]+=r.final.pointsB; }
    });
    [0,1].forEach(sub => {
      const r = evaluateMatch('m4', idx, sub);
      if(r.final.finished){ pts[teamA.id]+=r.final.pointsA; pts[teamB.id]+=r.final.pointsB; }
    });
  });
  return pts;
}

/* =========================================================
   RENDERING
   ========================================================= */
function teamColor(teamIdx){ return COLORS[teamIdx % COLORS.length]; }
function teamIdxById(id){ return STATE.teams.findIndex(t=>t.id===id); }

function renderHeader(){
  const pts = computeStandings();
  const ranked = STATE.teams.map((t,i)=>({...t, idx:i, pts:pts[t.id]})).sort((a,b)=>b.pts-a.pts);
  const cards = ranked.map(t => `
    <div class="flex-shrink-0 flex items-center gap-2 bg-[#0f1913]/80 border border-[#233327] rounded-xl px-3 py-2 min-w-[112px]">
      <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:${teamColor(t.idx)}"></span>
      <div class="leading-tight">
        <div class="text-[11px] text-[#9db3a4] truncate max-w-[80px]">${escapeHtml(t.name)}</div>
        <div class="font-display font-700 text-lg text-[#eef3ee]">${t.pts.toFixed(1)}</div>
      </div>
    </div>`).join('');

  const online = navigator.onLine;
  const syncLabel = online ? 'Online · Synced' : 'Offline · Cache Saved';
  const syncDot = online ? 'bg-emerald-400' : 'bg-amber-400';
  const syncText = online ? 'text-emerald-300' : 'text-amber-300';

  return `
  <div class="shell-pattern border-b border-[#1c2a20] bg-gradient-to-b from-[#0f1a13] to-[#0a100c]">
    <div class="px-4 pt-4 pb-3 flex items-start justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-2xl">🐢</span>
          <h1 class="font-display font-700 text-xl tracking-tight">Turtle Cup</h1>
        </div>
        <p class="text-[11px] text-[#7f9689] mt-0.5">Terrapin Ridge Golf Club · Team Match Play</p>
        <div class="flex items-center gap-1.5 mt-1.5">
          <span class="w-1.5 h-1.5 rounded-full ${syncDot}"></span>
          <span class="text-[10px] font-medium ${syncText}">${syncLabel}</span>
          ${lastSavedAt ? `<span class="text-[10px] text-[#5c6f61]">· ${formatClock(lastSavedAt)}</span>` : ''}
        </div>
      </div>
      <div class="flex gap-1.5 flex-shrink-0">
        <button data-action="demo" title="Fill demo scores" class="text-[11px] px-2.5 py-1.5 rounded-lg bg-[#16241b] border border-[#243527] text-[#c9d8cd] hover:border-[#3fae6a] active:scale-95 transition">🎲 Demo</button>
        <button data-action="reset-scores" title="Clear all scores" class="text-[11px] px-2.5 py-1.5 rounded-lg bg-[#16241b] border border-[#243527] text-[#c9d8cd] hover:border-[#e2696f] active:scale-95 transition">↺ Reset</button>
        <button data-action="toggle-admin" title="Admin Mode" class="text-[11px] px-2.5 py-1.5 rounded-lg border active:scale-95 transition ${STATE.admin.enabled ? 'bg-[#3a2f12] border-[#d9b25c] text-[#f2d17f]' : 'bg-[#16241b] border-[#243527] text-[#c9d8cd] hover:border-[#d9b25c]'}">${STATE.admin.enabled ? '🔓' : '🔒'}</button>
      </div>
    </div>
    ${STATE.admin.enabled ? renderAdminPanel() : ''}
    <div class="px-4 pb-3 pt-1 flex items-center gap-1.5 text-[10px] uppercase tracking-wider text-[#d9b25c] font-semibold">
      <span class="h-px flex-1 bg-[#2a3a2c]"></span><span>Team Standings</span><span class="h-px flex-1 bg-[#2a3a2c]"></span>
    </div>
    <div class="px-4 pb-4 flex gap-2 overflow-x-auto">${cards}</div>
  </div>`;
}

function renderAdminPanel(){
  return `
  <div class="mx-4 mt-1 rounded-xl border border-[#7d6a2f] bg-[#201a0c] p-3 fade-in">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-semibold text-[#f2d17f]">🛠️ Admin &amp; Maintenance</span>
      <span class="text-[10px] text-[#c9a54e]">Score override active on all cards</span>
    </div>
    <div class="flex flex-wrap gap-2">
      <button data-action="export-data" class="text-[11px] px-2.5 py-1.5 rounded-lg bg-[#16241b] border border-[#243527] text-[#c9d8cd] hover:border-[#3fae6a] active:scale-95 transition">⬇ Export Tournament Data</button>
      <label class="text-[11px] px-2.5 py-1.5 rounded-lg bg-[#16241b] border border-[#243527] text-[#c9d8cd] hover:border-[#3fae6a] active:scale-95 transition cursor-pointer">
        ⬆ Import Tournament Data
        <input type="file" accept="application/json" data-action="import-data" class="hidden" />
      </label>
      <button data-action="hard-reset" class="text-[11px] px-2.5 py-1.5 rounded-lg bg-[#2a1418] border border-[#7d2f3a] text-[#f2a1ab] hover:border-[#e2696f] active:scale-95 transition">⚠ Reset Tournament</button>
    </div>
  </div>`;
}

function renderNav(){
  const tabs = [
    ...Object.values(MATCH_META).map(m=>({ id:m.id, label:m.label.replace('Match ','M') })),
    { id:'teams', label:'Teams' },
  ];
  return `
  <div class="sticky top-0 z-20 bg-[#0a100c]/95 backdrop-blur border-b border-[#1c2a20] px-3 py-2">
    <div class="grid grid-cols-5 gap-1.5">
      ${tabs.map(t => `
        <button data-tab="${t.id}" class="text-xs font-semibold py-2 rounded-lg transition ${STATE.ui.tab===t.id ? 'tab-active' : 'tab-inactive bg-[#111c15] border border-[#1f2f26] hover:border-[#3fae6a]'}">${t.label}</button>
      `).join('')}
    </div>
  </div>`;
}

function pillRow(items, selectedIdx, groupAttr){
  if(items.length<=1) return '';
  return `<div class="px-4 pt-3 flex gap-2 overflow-x-auto">${items.map((label,i)=>`
    <button ${groupAttr}="${i}" class="flex-shrink-0 text-xs font-medium px-3 py-1.5 rounded-full border transition ${i===selectedIdx ? 'bg-[#3fae6a] text-[#0a100c] border-[#3fae6a]' : 'bg-[#111c15] text-[#9db3a4] border-[#243527] hover:border-[#3fae6a]'}">${label}</button>
  `).join('')}</div>`;
}

function matchupLabel(pair){
  const a = STATE.teams[pair.a], b = STATE.teams[pair.b];
  return `${a.name} vs ${b.name}`;
}

function banner(evalr, matchId, pairIdx, sub){
  const { final, currentDiff, enteredCount, teamA, teamB } = evalr;
  const aIdx = teamIdxById(teamA.id), bIdx = teamIdxById(teamB.id);
  let text, sub2 = '', tone = 'neutral';

  if(final.finished){
    if(final.winner==='halved'){
      text = 'Match Halved — All Square'; tone='halved';
    } else {
      const w = final.winner==='a' ? teamA : teamB;
      text = `${escapeHtml(w.name)} win ${final.closeout}`; tone='decided';
    }
    sub2 = `Points — ${escapeHtml(teamA.name)} ${final.pointsA.toFixed(1)} · ${escapeHtml(teamB.name)} ${final.pointsB.toFixed(1)}`;
  } else if(enteredCount===0){
    text = 'Match not started'; tone='idle';
  } else if(currentDiff===0){
    text = `All Square thru ${enteredCount}`; tone='idle';
  } else {
    const leader = currentDiff>0 ? teamA : teamB;
    text = `${escapeHtml(leader.name)} ${Math.abs(currentDiff)} UP thru ${enteredCount}`; tone='live';
  }

  const toneClasses = {
    decided: 'bg-[#123a22] border-[#2f7d4f] text-[#7be6a4]',
    halved: 'bg-[#3a2f12] border-[#7d6a2f] text-[#f2d17f]',
    live: 'bg-[#132436] border-[#2f5a7d] text-[#8fc4f2]',
    idle: 'bg-[#161f1a] border-[#243527] text-[#9db3a4]',
  };

  let lockTag = '';
  if(final.finished){
    lockTag = STATE.admin.enabled
      ? `<span class="ml-auto flex-shrink-0 text-[10px] font-semibold px-2 py-0.5 rounded-full bg-[#3a2f12] text-[#f2d17f] border border-[#7d6a2f]">✏️ Admin Override</span>`
      : `<span class="ml-auto flex-shrink-0 text-[10px] font-semibold px-2 py-0.5 rounded-full bg-[#161f1a] text-[#7f9689] border border-[#243527]">🔒 Final</span>`;
  }

  return `
  <div class="mx-4 mt-3 rounded-xl border px-3 py-2.5 ${toneClasses[tone]} fade-in">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full flex-shrink-0" style="background:${teamColor(aIdx)}"></span>
      <div class="font-display font-600 text-sm">${text}</div>
      <span class="w-2 h-2 rounded-full flex-shrink-0" style="background:${teamColor(bIdx)}"></span>
      ${lockTag}
    </div>
    ${sub2 ? `<div class="text-[11px] mt-1 opacity-80">${sub2}</div>` : ''}
    ${final.finished && !STATE.admin.enabled ? `<div class="text-[10px] mt-1 opacity-70">Scorecard locked now that the match is decided. Enable Admin Mode to override.</div>` : ''}
  </div>`;
}

function inputCell(value, attrs, locked){
  return `<input type="number" inputmode="numeric" min="1" max="15" value="${value}" ${locked ? 'disabled' : ''}
    class="score-input w-9 text-center rounded-md py-1 text-[13px] focus:outline-none focus:ring-2 focus:ring-[#3fae6a] ${locked ? 'bg-[#0c130f] border border-[#1c2a20] text-[#5c6f61] cursor-not-allowed' : 'bg-[#0e1712] border border-[#24352a] text-[#eef3ee]'}"
    ${attrs} />`;
}

function statusCellText(diff){
  if(diff==null) return '—';
  if(diff===0) return 'AS';
  return diff>0 ? `${diff}↑` : `${Math.abs(diff)}↓`;
}

function renderBetterBallTable(matchId, pairIdx){
  const evalr = evaluateMatch(matchId, pairIdx);
  const { teamA, teamB, holesDetail, statusPerHole } = evalr;
  const locked = evalr.final.finished && !STATE.admin.enabled;
  const rows = holesDetail.map((h,i) => `
    <tr class="border-b border-[#182319] ${h.winner ? (h.winner==='a'?'bg-[#123a22]/25':(h.winner==='b'?'bg-[#3a1220]/20':'')) : ''}">
      <td class="sticky-col px-2 py-1.5 text-[#9db3a4] font-medium">${h.hole}</td>
      <td class="px-2 py-1.5 text-center text-[#7f9689]">${h.par}</td>
      <td class="px-2 py-1.5 text-center text-[#7f9689]">${h.si}</td>

function renderMatchTab(matchId){
  const meta = MATCH_META[matchId];
  const pairs = STATE.pairs;
  const validPairs = pairs.map((p,i)=>({...p, idx:i})).filter(p=>p.b!==null);
  const byePairs = pairs.map((p,i)=>({...p, idx:i})).filter(p=>p.b===null);

  let header = `
  <div class="px-4 pt-4">
    <h2 class="font-display font-700 text-lg">${meta.label}</h2>
    <p class="text-xs text-[#7f9689]">${meta.sub}</p>
  </div>`;

  if(validPairs.length===0){
    return header + `<p class="mx-4 mt-4 text-sm text-[#7f9689]">Add at least two teams to generate a matchup.</p>`;
  }

  const pairIdx = Math.min(STATE.ui.pairing[matchId] || 0, validPairs.length-1);
  const activePairing = validPairs[pairIdx].idx;

  let body = pillRow(validPairs.map(p=>matchupLabel(STATE.pairs[p.idx])), pairIdx, `data-pairing-select-${matchId}`);

  if(matchId==='m4'){
    const pair = STATE.pairs[activePairing];
    const teamA = STATE.teams[pair.a], teamB = STATE.teams[pair.b];
    const singleIdx = STATE.ui.single[activePairing] || 0;
    const subLabels = [
      `${initials(teamA.players[0].name)} vs ${initials(teamB.players[0].name)}`,
      `${initials(teamA.players[1].name)} vs ${initials(teamB.players[1].name)}`,
    ];
    body += pillRow(subLabels, singleIdx, `data-sub-select-${activePairing}`);
    body += renderSinglesTable('m4', activePairing, singleIdx);
  } else if(matchId==='m3'){
    body += renderPinehurstTable('m3', activePairing);
  } else {
    body += renderBetterBallTable(matchId, activePairing);
  }

  if(byePairs.length){
    body += `<p class="mx-4 mb-4 text-[11px] text-[#66786b]">Bye: ${byePairs.map(p=>escapeHtml(STATE.teams[STATE.pairs[p.idx].a].name)).join(', ')} (odd team count — no opponent this round).</p>`;
  }

  return header + body;
}

function renderTeamsTab(){
  const cards = STATE.teams.map((t,i) => `
    <div class="mx-4 mb-3 rounded-xl border border-[#1f2f26] bg-[#0f1913] overflow-hidden">
      <div class="flex items-center gap-2 px-3 py-2.5 border-b border-[#1c2a20]">
        <span class="w-3 h-3 rounded-full flex-shrink-0" style="background:${teamColor(i)}"></span>
        <input value="${escapeAttr(t.name)}" data-team="${t.id}" data-field="name"
          class="team-field bg-transparent font-display font-600 text-sm flex-1 focus:outline-none border-b border-transparent focus:border-[#3fae6a]" />
        ${STATE.teams.length>4 ? `<button data-action="remove-team" data-team-id="${t.id}" class="text-[#e2696f] text-xs px-2 py-1 rounded hover:bg-[#2a1418]">Remove</button>` : ''}
      </div>
      <div class="px-3 py-2 space-y-2">
        ${t.players.map((pl,pi)=>`
          <div class="flex items-center gap-2">
            <input value="${escapeAttr(pl.name)}" data-team="${t.id}" data-player="${pi}" data-field="pname"

            <div class="flex items-center gap-1 text-xs text-[#7f9689]">
              <span>HCP</span>
              <input type="number" value="${pl.hcp}" data-team="${t.id}" data-player="${pi}" data-field="hcp"
                class="team-field w-14 text-center bg-[#0e1712] border border-[#24352a] rounded-lg px-1 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#3fae6a]" />

    <p class="text-xs text-[#7f9689]">4–8 two-man teams. Editing a handicap instantly recalculates net scores. Adding or removing a team resets scorecards and re-pairs matchups.</p>
  </div>
  ${cards}
  <div class="mx-4 mb-6">
    <button data-action="add-team" ${STATE.teams.length>=8?'disabled':''} class="w-full text-sm font-medium py-2.5 rounded-lg border border-dashed border-[#3fae6a] text-[#7be6a4] disabled:opacity-30 disabled:cursor-not-allowed hover:bg-[#123a22]/30 transition">+ Add Team ${STATE.teams.length>=8 ? '(max 8)' : ''}</button>
  </div>`;

function renderApp(){
  const root = document.getElementById('root');
  let content;
  if(STATE.ui.tab==='teams') content = renderTeamsTab();
  else content = renderMatchTab(STATE.ui.tab);

  root.innerHTML = `
    ${renderHeader()}
    ${renderNav()}
    <div class="flex-1 pb-8">${content}</div>
  `;

  saveState();
}

/* =========================================================
   HELPERS
   ========================================================= */
function initials(name){
  return name.split(' ').map(w=>w[0]).join('').toUpperCase();
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

/* =========================================================
   EVENT HANDLING
   ========================================================= */
const root = document.getElementById('root');

root.addEventListener('click', (e) => {
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ STATE.ui.tab = tabBtn.dataset.tab; renderApp(); return; }

  for(const mid of Object.keys(MATCH_META)){
    const pBtn = e.target.closest(`[data-pairing-select-${mid}]`);
    if(pBtn){ STATE.ui.pairing[mid] = parseInt(pBtn.getAttribute(`data-pairing-select-${mid}`),10); renderApp(); return; }
  }
  const subBtn = e.target.closest('[data-sub-select-0], [data-sub-select-1], [data-sub-select-2], [data-sub-select-3], [data-sub-select-4], [data-sub-select-5], [data-sub-select-6], [data-sub-select-7]');
  if(subBtn){
    for(const attr of subBtn.attributes){
      if(attr.name.startsWith('data-sub-select-')){
        const pairingIdx = attr.name.replace('data-sub-select-','');
        STATE.ui.single[pairingIdx] = parseInt(attr.value,10);
        renderApp();
        return;
      }
    }
  }

  const action = e.target.closest('[data-action]');
  if(action){
    const act = action.dataset.action;
    if(act==='add-team'){
      if(STATE.teams.length<8){
        STATE.teams.push({ id:'t'+nextTeamNum, name:'New Team '+nextTeamNum, players:[
          { id:'p'+nextPlayerNum, name:'Player A', hcp:15 },
          { id:'p'+(nextPlayerNum+1), name:'Player B', hcp:15 },
        ]});
        nextTeamNum++; nextPlayerNum+=2;
        buildScores();
        renderApp();
      }
    } else if(act==='remove-team'){
      if(STATE.teams.length>4){
        STATE.teams = STATE.teams.filter(t=>t.id!==action.dataset.teamId);
        buildScores();
        renderApp();
      }
    } else if(act==='demo'){
      fillDemoScores();
      renderApp();
    } else if(act==='reset-scores'){
      buildScores();
      renderApp();
    } else if(act==='toggle-admin'){
      if(STATE.admin.enabled){
        STATE.admin.enabled = false;
        renderApp();
      } else {
        const pass = prompt('Enter admin passcode to unlock Admin Mode:');
        if(pass===null) return;
        if(pass===ADMIN_PASSCODE){
          STATE.admin.enabled = true;
          renderApp();
        } else {
          alert('Incorrect passcode.');
        }
      }
    } else if(act==='export-data'){
      exportData();
    } else if(act==='hard-reset'){
      if(confirm('This permanently erases all teams and scores and restores baseline mock data. Continue?')){
        localStorage.removeItem(LS_KEY);
        STATE.teams = defaultTeams();
        buildScores();
        recalcCounters();
        renderApp();
      }
    }
  }
});

root.addEventListener('change', (e) => {
  if(e.target.matches('.score-input')){
    const el = e.target;
    if(el.disabled) return; // locked scorecard — admin mode required to override
    const matchId = el.dataset.match;
    const pairing = parseInt(el.dataset.pairing,10);
    const hole = parseInt(el.dataset.hole,10);
    const role = el.dataset.role;
    const sub = el.dataset.sub;
    const val = el.value === '' ? '' : Math.max(1, Math.min(15, parseInt(el.value,10) || 1));

    let entry;
    if(matchId==='m4'){
      entry = STATE.scores.m4[pairing][parseInt(sub,10)];
    } else {
      entry = STATE.scores[matchId][pairing];
    }
    entry.holes[hole][role] = val;
    renderApp();
  } else if(e.target.matches('.team-field')){
    const el = e.target;
    const team = STATE.teams.find(t=>t.id===el.dataset.team);
    if(!team) return;
    const field = el.dataset.field;
    if(field==='name'){ team.name = el.value || team.name; }
    else if(field==='pname'){ team.players[parseInt(el.dataset.player,10)].name = el.value || 'Player'; }
    else if(field==='hcp'){ team.players[parseInt(el.dataset.player,10)].hcp = Math.max(0, parseInt(el.value,10) || 0); }
    renderApp();
  } else if(e.target.matches('[data-action="import-data"]')){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || !Array.isArray(parsed.teams) || !parsed.scores) throw new Error('Invalid shape');
        STATE.teams = parsed.teams;
        STATE.pairs = parsed.pairs && parsed.pairs.length ? parsed.pairs : pairTeams();
        STATE.scores = parsed.scores;
        recalcCounters();
        renderApp();
        alert('Tournament data imported successfully.');
      } catch(err){
        alert('Import failed: that file is not valid Turtle Cup tournament data.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }
});

// Enter key moves focus to next score input for fast entry
root.addEventListener('keydown', (e) => {
  if(e.key==='Enter' && e.target.matches('.score-input')){
    e.preventDefault();
    const inputs = Array.from(document.querySelectorAll('.score-input'));
    const i = inputs.indexOf(e.target);
    e.target.dispatchEvent(new Event('change', {bubbles:true}));
    if(i>=0 && i<inputs.length-1) inputs[i+1].focus();
    else e.target.blur();
  }
});

/* =========================================================
   ADMIN: BACKUP / RECOVERY
   ========================================================= */
function exportData(){
  const payload = {
    app: 'turtle-cup', version: 1, exportedAt: new Date().toISOString(),
    teams: STATE.teams, pairs: STATE.pairs, scores: STATE.scores,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `turtle-cup-backup-${Date.now()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* =========================================================
   DEMO DATA GENERATOR
   ========================================================= */
function randScore(par){
  const wobble = [-1,-1,0,0,0,0,1,1,1,2];
  return Math.max(2, par + wobble[Math.floor(Math.random()*wobble.length)]);
}

function fillDemoScores(){
  STATE.pairs.forEach((pair, idx) => {
    if(pair.b===null) return;
    ['m1','m2'].forEach(mid => {
      const entry = STATE.scores[mid][idx];
      for(let i=0;i<18;i++){
        const par = PARS[i];
        entry.holes[i] = { a1:randScore(par), a2:randScore(par), b1:randScore(par), b2:randScore(par) };
      }
    });
    const m3entry = STATE.scores.m3[idx];
    for(let i=0;i<9;i++){
      const par = PARS[9+i];
      m3entry.holes[i] = { a:randScore(par), b:randScore(par) };
    }
    [0,1].forEach(sub => {
      const entry = STATE.scores.m4[idx][sub];
      for(let i=0;i<18;i++){
        const par = PARS[i];
        entry.holes[i] = { a:randScore(par), b:randScore(par) };
      }
    });
  });
}

/* =========================================================
   BOOT
   ========================================================= */
if(!loadState()){
  buildScores();
}
recalcCounters();
renderApp();

window.addEventListener('online', renderApp);
window.addEventListener('offline', renderApp);
</script>
